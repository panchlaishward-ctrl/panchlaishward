/* =====================================================
   PDF URL
===================================================== */

function getPdfUrl(filename){

return PDF_BASE_URL +
encodeURIComponent(filename);

}


/* =====================================================
   TIMEOUT WRAPPER
===================================================== */

function withTimeout(
promise,
ms,
label
){

return new Promise(
function(resolve,reject){

let finished = false;

const timer =
setTimeout(
function(){

if(finished)return;

finished = true;

reject(
new Error(
label + " — timeout"
)
);

},
ms
);


promise.then(
function(value){

if(finished)return;

finished = true;

clearTimeout(timer);

resolve(value);

},
function(error){

if(finished)return;

finished = true;

clearTimeout(timer);

reject(error);

});

});

}


/* =====================================================
   YIELD
===================================================== */

function yieldToBrowser(
delay=20
){

return new Promise(
function(resolve){

setTimeout(
resolve,
delay
);

});

}


/* =====================================================
   BANGLA DIGIT
===================================================== */

function banglaToEnglishDigits(
value
){

if(
value===null ||
value===undefined
){

return "";

}

const bangla =
"০১২৩৪৫৬৭৮৯";

const english =
"0123456789";

return String(value)
.split("")
.map(function(ch){

const index =
bangla.indexOf(ch);

return index>=0
?english[index]
:ch;

})
.join("");

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeText(
value
){

if(
value===null ||
value===undefined
){

return "";

}

let text =
banglaToEnglishDigits(
String(value)
);

return text
.toLowerCase()
.replace(
/[\u200B-\u200D\uFEFF]/g,
""
)
.replace(
/[।,;:!?()[\]{}"'`]/g,
" "
)
.replace(
/\s+/g,
" "
)
.trim();

}


/* =====================================================
   NAME
===================================================== */

function cleanNameInput(
value
){

return normalizeText(
String(value || "")
.replace(
/\s+/g,
" "
)
.trim()
);

}


/* =====================================================
   DOB
===================================================== */

function cleanDobInput(
value
){

return banglaToEnglishDigits(
String(value || "")
.replace(
/\s+/g,
" "
)
.trim()
);

}


/* =====================================================
   DATE DIGITS
===================================================== */

function normalizeDateDigits(
str
){

return banglaToEnglishDigits(
String(str || "")
).replace(
/\D/g,
""
);

}


/* =====================================================
   DATE CHECK
===================================================== */

function dateExistsInText(
text,
searchDate
){

if(!searchDate)return true;

const target =
normalizeDateDigits(
searchDate
);

if(!target)return false;

const raw =
banglaToEnglishDigits(
String(text || "")
);

const digits =
raw.replace(
/\D/g,
""
);

if(
digits.includes(target)
){

return true;

}


/*
DD/MM/YYYY
*/

if(
target.length===8
){

const d =
target.substring(0,2);

const m =
target.substring(2,4);

const y =
target.substring(4,8);

const variants=[

d+"/"+m+"/"+y,

d+"-"+m+"-"+y,

d+"."+m+"."+y,

d+" "+m+" "+y

];

for(
const v of variants
){

if(raw.includes(v))
return true;

}

}

return false;

}


/* =====================================================
   NAME CHECK
===================================================== */

function nameExistsInText(
text,
name
){

if(!name)return true;

const source =
normalizeText(text);

const target =
normalizeText(name);

if(
source.includes(target)
){

return true;

}

return source
.replace(/\s/g,"")
.includes(
target.replace(/\s/g,"")
);

}


/* =====================================================
   EXTRACT PDF
===================================================== */

async function extractPdfPages(
filename
){

const url =
getPdfUrl(filename);

let pdf = null;

try{

pdf =
await withTimeout(
pdfjsLib.getDocument({
url:url,
disableAutoFetch:false,
disableStream:false
}).promise,
PDF_TIMEOUT,
"PDF লোড"
);


const pages=[];

let totalCharacters=0;


for(
let pageNumber=1;
pageNumber<=pdf.numPages;
pageNumber++
){

const page =
await withTimeout(
pdf.getPage(pageNumber),
PAGE_TIMEOUT,
"পৃষ্ঠা লোড"
);


const content =
await withTimeout(
page.getTextContent(),
PAGE_TIMEOUT,
"পৃষ্ঠা text পড়া"
);


const rawText =
content.items
.map(function(item){
return item.str || "";
})
.join(" ");


const text =
normalizeText(rawText);


totalCharacters +=
text.length;


pages.push({

page:pageNumber,

text:text

});


try{
page.cleanup();
}catch(e){}


if(
pageNumber%2===0
){

await yieldToBrowser();

}

}


return{

filename:filename,

url:url,

pageCount:pages.length,

pages:pages,

totalCharacters:
totalCharacters

};


}finally{

if(pdf){

try{
await pdf.destroy();
}catch(e){}

}

}

}


/* =====================================================
   RETRY PDF
===================================================== */

async function extractPdfWithRetry(
filename,
retry=2
){

let lastError=null;

for(
let attempt=1;
attempt<=retry;
attempt++
){

try{

return await extractPdfPages(
filename
);

}catch(error){

lastError=error;

console.warn(
"PDF retry:",
filename,
attempt,
error
);

await yieldToBrowser(
500
);

}

}

throw lastError ||
new Error(
"PDF পড়া যায়নি"
);

}

/* =====================================================
   OCR WORKER
===================================================== */

async function createOCRWorker(){

if(
OCR_READY &&
OCR_WORKER
){

return OCR_WORKER;

}


if(OCR_LOADING){

while(OCR_LOADING){

await yieldToBrowser(100);

}

return OCR_WORKER;

}


OCR_LOADING=true;


try{

document.getElementById(
"status"
).innerHTML=
`<strong>বাংলা OCR প্রস্তুত হচ্ছে...</strong><br>
প্রথমবার কিছুটা সময় লাগতে পারে।`;


OCR_WORKER =
await Tesseract.createWorker(
"ben+eng"
);


OCR_READY=true;

return OCR_WORKER;


}finally{

OCR_LOADING=false;

}

}


/* =====================================================
   OCR CACHE
===================================================== */

function saveOCRCache(
key,
data
){

if(
OCR_CACHE.size>=
OCR_CACHE_LIMIT
){

const first =
OCR_CACHE.keys()
.next()
.value;

if(first){

OCR_CACHE.delete(first);

}

}

OCR_CACHE.set(
key,
data
);

}


/* =====================================================
   OCR PAGE
===================================================== */

async function ocrPdfPage(
pdfDocument,
pdfData,
pageNumber
){

const cacheKey =
pdfData.filename+
"::"+
pageNumber;


if(
OCR_CACHE.has(cacheKey)
){

return OCR_CACHE.get(
cacheKey
);

}


let page=null;

let canvas=null;


try{

page =
await withTimeout(
pdfDocument.getPage(
pageNumber
),
PAGE_TIMEOUT,
"OCR page load"
);


const viewport =
page.getViewport({
scale:1.5
});


canvas =
document.createElement(
"canvas"
);


const context =
canvas.getContext(
"2d",
{
willReadFrequently:true
}
);


canvas.width =
Math.floor(
viewport.width
);

canvas.height =
Math.floor(
viewport.height
);


await withTimeout(
page.render({
canvasContext:context,
viewport:viewport
}).promise,
PAGE_TIMEOUT*2,
"OCR render"
);


const worker =
await createOCRWorker();


const result =
await worker.recognize(
canvas
);


const text =
normalizeText(
result.data.text || ""
);


const data={

page:pageNumber,

text:text

};


saveOCRCache(
cacheKey,
data
);


return data;


}finally{

if(canvas){

canvas.width=1;

canvas.height=1;

try{
canvas.remove();
}catch(e){}

}


if(page){

try{
page.cleanup();
}catch(e){}

}


await yieldToBrowser(20);

}

}


/* =====================================================
   OCR WHOLE PDF
===================================================== */

async function runOCRForPdf(
pdfData
){

if(
pdfData.ocrPages
){

return pdfData.ocrPages;

}


const progress =
document.getElementById(
"ocrProgress"
);

const label =
document.getElementById(
"ocrProgressLabel"
);

const fill =
document.getElementById(
"ocrProgressFill"
);

const status =
document.getElementById(
"status"
);


progress.style.display=
"block";


fill.style.width="0%";


let pdf=null;

const pages=[];


try{

pdf =
await withTimeout(
pdfjsLib.getDocument({
url:pdfData.url
}).promise,
PDF_TIMEOUT,
"OCR PDF load"
);


const total =
pdf.numPages;


for(
let i=1;
i<=total;
i++
){

const percent =
Math.round(
(i/total)*100
);


fill.style.width=
percent+"%";


label.innerText=
`OCR: ${i}/${total}`;


status.innerHTML=
`<strong>OCR চলছে...</strong><br>
${escapeHtml(pdfData.filename)}<br>
পৃষ্ঠা ${i}/${total}`;


try{

const page =
await ocrPdfPage(
pdf,
pdfData,
i
);

pages.push(page);

}catch(error){

console.error(
"OCR page error:",
error
);

}


await yieldToBrowser(40);

}


pdfData.ocrPages=pages;

fill.style.width="100%";

label.innerText=
"OCR সম্পন্ন হয়েছে।";


return pages;


}finally{

if(pdf){

try{
await pdf.destroy();
}catch(e){}

}

}

}


/* =====================================================
   SEARCH SCANNED
===================================================== */

async function searchScannedPdfs(
name,
dob
){

const found=[];


const scanned =
PDF_INDEX.filter(
function(pdf){

return pdf.totalCharacters<10;

}
);


for(
let i=0;
i<scanned.length;
i++
){

const pdf =
scanned[i];


document.getElementById(
"status"
).innerHTML=
`<strong>OCR অনুসন্ধান চলছে...</strong><br>
Scanned PDF ${i+1}/${scanned.length}<br>
${escapeHtml(pdf.filename)}`;


let pages;


try{

pages =
await runOCRForPdf(pdf);

}catch(error){

console.error(
"OCR error:",
error
);

continue;

}


const matched=[];


for(
const page of pages
){

const nameMatch =
name
?nameExistsInText(
page.text,
name
)
:true;


const dobMatch =
dob
?dateExistsInText(
page.text,
dob
)
:true;


if(
nameMatch &&
dobMatch
){

matched.push(
page.page
);

}


await yieldToBrowser();

}


if(
matched.length
){

found.push({

filename:
pdf.filename,

url:
pdf.url,

pages:
matched,

ocr:true

});

}

}


return found;

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(
value
){

return String(value)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeJs(
value
){

return String(value)

.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}

/* =====================================================
   VIEW PDF
===================================================== */

async function viewPdf(
filename,
startPage=1
){

const section =
document.getElementById(
"viewerSection"
);

const title =
document.getElementById(
"viewerTitle"
);

const viewer =
document.getElementById(
"pdfViewer"
);


section.style.display="block";

title.innerText=filename;

viewer.innerHTML=
`<div class="viewer-loading">
PDF লোড হচ্ছে...
</div>`;


section.scrollIntoView({
behavior:"smooth",
block:"start"
});


await destroyViewerPdf();


try{

viewerPdfDocument =
await withTimeout(
pdfjsLib.getDocument({
url:getPdfUrl(filename)
}).promise,
PDF_TIMEOUT,
"Viewer PDF load"
);


viewerFilename=filename;

viewerTotalPages =
viewerPdfDocument.numPages;


viewerCurrentPage =
Math.min(
Math.max(
parseInt(startPage)||1,
1
),
viewerTotalPages
);


updateViewerButtons();

await renderViewerPage(
viewerCurrentPage
);


}catch(error){

console.error(
"Viewer error:",
error
);


viewer.innerHTML=
`<div class="error">
PDF দেখানো যাচ্ছে না।<br><br>
${escapeHtml(
error.message || ""
)}
</div>`;

}

}


/* =====================================================
   RENDER VIEWER
===================================================== */

async function renderViewerPage(
pageNumber
){

if(
!viewerPdfDocument ||
viewerRendering
){

return;

}


viewerRendering=true;

const token =
++viewerRenderToken;


const viewer =
document.getElementById(
"pdfViewer"
);


try{

cleanupViewerCanvas();


viewer.innerHTML=
`<div class="viewer-loading">
পৃষ্ঠা ${pageNumber}
লোড হচ্ছে...
</div>`;


const page =
await withTimeout(
viewerPdfDocument.getPage(
pageNumber
),
PAGE_TIMEOUT,
"Viewer page"
);


if(
token!==viewerRenderToken
){

try{
page.cleanup();
}catch(e){}

return;

}


const base =
page.getViewport({
scale:1
});


const maxWidth =
Math.min(
window.innerWidth*.92,
1000
);


let scale =
maxWidth/base.width;


if(scale>1.8)
scale=1.8;


if(scale<1)
scale=1;


const viewport =
page.getViewport({
scale:scale
});


const wrapper =
document.createElement(
"div"
);

wrapper.className=
"pdf-page";


const canvas =
document.createElement(
"canvas"
);


canvas.width =
Math.floor(
viewport.width
);

canvas.height =
Math.floor(
viewport.height
);


wrapper.appendChild(canvas);


const watermark =
document.createElement(
"div"
);

watermark.className=
"watermark";

watermark.innerHTML=
`আলী ইসলাম
<small>
উদ্যোক্তা<br>
০৩ নং পাঁচলাইশ ওয়ার্ড
</small>`;


wrapper.appendChild(
watermark
);


viewer.innerHTML="";

viewer.appendChild(
wrapper
);


const context =
canvas.getContext(
"2d"
);


await withTimeout(
page.render({
canvasContext:context,
viewport:viewport
}).promise,
PAGE_TIMEOUT*2,
"Viewer render"
);


try{
page.cleanup();
}catch(e){}


await yieldToBrowser();


}catch(error){

console.error(
"Render error:",
error
);


viewer.innerHTML=
`<div class="error">
পৃষ্ঠা দেখানো যাচ্ছে না।<br><br>
${escapeHtml(
error.message || ""
)}
</div>`;


}finally{

viewerRendering=false;

updateViewerButtons();

}

}


/* =====================================================
   CLEANUP
===================================================== */

function cleanupViewerCanvas(){

const viewer =
document.getElementById(
"pdfViewer"
);


viewer
.querySelectorAll(
"canvas"
)
.forEach(
function(canvas){

try{

const ctx =
canvas.getContext(
"2d"
);

if(ctx){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

}

}catch(e){}


canvas.width=1;

canvas.height=1;

try{
canvas.remove();
}catch(e){}

}
);


viewer.innerHTML="";

}

   NAVIGATION
===================================================== */

async function previousPdfPage(){

if(
!viewerPdfDocument ||
viewerRendering ||
viewerCurrentPage<=1
){

viewerCurrentPage--;

updateViewerButtons();

viewerCurrentPage
);

!viewerPdfDocument ||
viewerRendering ||
viewerCurrentPage>=viewerTotalPages
){

return;

}


viewerCurrentPage++;

updateViewerButtons();

await renderViewerPage(
viewerCurrentPage
);

}
