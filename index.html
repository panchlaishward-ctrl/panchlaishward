<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>৩ নং পাঁচলাইশ ওয়ার্ড - ভোটার তথ্য অনুসন্ধান</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Noto Sans Bengali","Noto Sans",Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

/* LOGIN OVERLAY */
#loginOverlay{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:99999;
}

.loginBox{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,.30);
}

.loginLogo{
    text-align:center;
    font-size:42px;
    margin-bottom:8px;
}

.loginBox h2{
    text-align:center;
    margin:0;
    color:#0f172a;
}

.loginBox p{
    text-align:center;
    color:#64748b;
    margin-top:8px;
}

.formGroup{
    margin-top:18px;
}

.formGroup label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.formGroup input{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.formGroup input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

#loginBtn{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#loginBtn:hover{
    background:#1d4ed8;
}

#loginError{
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:#fee2e2;
    color:#b91c1c;
    display:none;
    text-align:center;
}

/* MAIN APP */
#app{
    display:none;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:white;
    padding:15px 20px;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.headerInner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.headerTitle{
    font-size:21px;
    font-weight:bold;
}

.headerSub{
    font-size:13px;
    opacity:.85;
    margin-top:4px;
}

.userArea{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

#loggedUserName{
    font-weight:bold;
}

#roleBadge{
    background:#22c55e;
    color:white;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

#logoutBtn{
    border:0;
    background:#ef4444;
    color:white;
    padding:8px 13px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

#logoutBtn:hover{
    background:#dc2626;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

/* SEARCH CARD */
.searchCard{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.searchCard h3{
    margin-top:0;
}

.searchGrid{
    display:grid;
    grid-template-columns:1fr 1fr auto auto;
    gap:12px;
    align-items:end;
}

@media(max-width:768px){
    .searchGrid{
        grid-template-columns:1fr;
    }
}

.inputBox label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.inputBox input{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    font-size:16px;
}

.btn{
    padding:12px 18px;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

#searchBtn{
    background:#2563eb;
    color:white;
}

#clearBtn{
    background:#e2e8f0;
    color:#0f172a;
}

#searchBtn:hover{
    background:#1d4ed8;
}

#clearBtn:hover{
    background:#cbd5e1;
}

/* STATUS */
#status{
    margin-top:15px;
    padding:12px;
    background:#eff6ff;
    color:#1d4ed8;
    border-radius:10px;
    display:none;
}

#status.success{
    background:#dcfce7;
    color:#166534;
}

#status.error{
    background:#fee2e2;
    color:#991b1b;
}

/* RESULT CARD */
.resultCard{
    margin-top:20px;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

#resultHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
    <div class="loginBox">
        <div class="loginLogo">🗳️</div>
        <h2>স্বাগতম</h2>
        <p>ভোটার তথ্য অনুসন্ধানে লগইন করুন</p>
        <div class="formGroup">
            <label for="username">ব্যবহারকারীর নাম</label>
            <input type="text" id="username" placeholder="ইউজারনেম লিখুন">
        </div>
        <div class="formGroup">
            <label for="password">পাসওয়ার্ড</label>
            <input type="password" id="password" placeholder="পাসওয়ার্ড লিখুন">
        </div>
        <button id="loginBtn" onclick="handleLogin()">লগইন করুন</button>
        <div id="loginError">ভুল তথ্য প্রদান করা হয়েছে!</div>
    </div>
</div>

<!-- MAIN APP -->
<div id="app">
    <header>
        <div class="headerInner">
            <div>
                <div class="headerTitle">৩ নং পাঁচলাইশ ওয়ার্ড</div>
                <div class="headerSub">ভোটার তথ্য অনুসন্ধান পোর্টালে আপনাকে স্বাগতম</div>
            </div>
            <div class="userArea">
                <span id="loggedUserName">এডমিন</span>
                <span id="roleBadge">সক্রিয়</span>
                <button id="logoutBtn" onclick="handleLogout()">লগআউট</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="searchCard">
            <h3>ভোটার খুঁজুন</h3>
            <div class="searchGrid">
                <div class="inputBox">
                    <label for="voterName">ভোটারের নাম</label>
                    <input type="text" id="voterName" placeholder="নাম দিয়ে খুঁজুন...">
                </div>
                <div class="inputBox">
                    <label for="voterId">ভোটার আইডি / NID</label>
                    <input type="text" id="voterId" placeholder="আইডি নম্বর দিয়ে খুঁজুন...">
                </div>
                <button class="btn" id="searchBtn" onclick="performSearch()">খুঁজুন</button>
                <button class="btn" id="clearBtn" onclick="clearFields()">মুছে ফেলুন</button>
            </div>
            <div id="status"></div>
        </div>

        <div class="resultCard">
            <div id="resultHeader">
                <h3>অনুসন্ধান ফলাফল</h3>
            </div>
            <div id="resultBody">
                <p style="color: #64748b;">উপরে তথ্য প্রবেশ করিয়ে অনুসন্ধান করুন।</p>
            </div>
        </div>
    </div>
</div>

<script>
function handleLogin() {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');

    // ডামি লগইন চেক (প্রয়োজন অনুযায়ী পরিবর্তন করতে পারেন)
    if(user !== '' && pass !== '') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('loggedUserName').innerText = user;
        errorDiv.style.display = 'none';
    } else {
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'ইউজারনেম এবং পাসওয়ার্ড দিন!';
    }
}

function handleLogout() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
}

function performSearch() {
    const name = document.getElementById('voterName').value;
    const id = document.getElementById('voterId').value;
    const statusDiv = document.getElementById('status');
    const resultBody = document.getElementById('resultBody');

    if(!name && !id) {
        statusDiv.className = 'error';
        statusDiv.style.display = 'block';
        statusDiv.innerText = 'অনুগ্রহ করে অনুসন্ধানের জন্য নাম অথবা আইডি নম্বর দিন।';
        return;
    }

    statusDiv.className = 'success';
    statusDiv.style.display = 'block';
    statusDiv.innerText = 'অনুসন্ধান সম্পন্ন হয়েছে!';

    resultBody.innerHTML = `
        <div style="padding: 10px; border-left: 4px solid #2563eb; background: #f8fafc;">
            <p><strong>নাম:</strong> ${name || 'প্রযোজ্য নয়'}</p>
            <p><strong>আইডি নম্বর:</strong> ${id || 'প্রযোজ্য নয়'}</p>
            <p><strong>ওয়ার্ড:</strong> ৩ নং পাঁচলাইশ ওয়ার্ড</p>
        </div>
    `;
}

function clearFields() {
    document.getElementById('voterName').value = '';
    document.getElementById('voterId').value = '';
    document.getElementById('status').style.display = 'none';
    document.getElementById('resultBody').innerHTML = '<p style="color: #64748b;">উপরে তথ্য প্রবেশ করিয়ে অনুসন্ধান করুন।</p>';
}
</script>

</body>
</html>
