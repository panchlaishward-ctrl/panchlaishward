/* =====================================================
   NORMALIZE TEXT
===================================================== */

function normalizeText(text){

    if(!text){

        return "";

    }


    return String(text)

        .toLowerCase()

        .trim()

        .replace(/\s+/g," ");

}


/* =====================================================
   BANGLA NUMBER TO ENGLISH
===================================================== */

function banglaToEnglishNumber(text){

    if(!text){

        return "";

    }


    const bangla =
        "০১২৩৪৫৬৭৮৯";


    const english =
        "0123456789";


    let result = "";


    for(
        const char of String(text)
    ){

        const index =
            bangla.indexOf(char);


        if(index !== -1){

            result +=
                english[index];

        }

        else{

            result +=
                char;

        }

    }


    return result;

}

    loginOverlay.style.display =
        "none";


    app.style.display =

        userId

}

/* =====================================================
   GET PDF URL
===================================================== */

function getPdfUrl(filename){

    return (
        GITHUB_RAW_BASE +
        encodeURIComponent(filename)
    );

}


/* =====================================================
   LOAD SAVED INDEX
===================================================== */

function loadSavedIndex(){

    try{

        const saved =
            localStorage.getItem(
                INDEX_STORAGE_KEY
            );


        if(!saved){

            return false;

        }


        const parsed =
            JSON.parse(saved);


        if(
            !Array.isArray(parsed)
        ){

            return false;

        }


        /*
           Index-এর PDF list অবশ্যই
           বর্তমান PDF_FILES-এর সাথে
           মিলে যেতে হবে।
        */

        const indexedNames =
            parsed.map(
                item =>
                    item.filename
            );


        const allPresent =
            PDF_FILES.every(
                filename =>
                    indexedNames.includes(
                        filename
                    )
            );


        if(!allPresent){

            return false;

        }


        voterIndex =
            parsed;


        return voterIndex.length > 0;

    }

    catch(error){

        console.error(
            "Saved index error:",
            error
        );


        return false;

    }

}


/* =====================================================
   SAVE INDEX
===================================================== */

function saveIndex(){

    localStorage.setItem(

        INDEX_STORAGE_KEY,

        JSON.stringify(
            voterIndex
        )

    );

}


/* =====================================================
   START INDEX PROCESS
===================================================== */

async function startIndexProcess(){

    if(indexBuilding){

        return;

    }


    indexReady =
        false;


    searchBtn.disabled =
        true;


    searchBtn.textContent =
        "🔄 তথ্য প্রস্তুত হচ্ছে...";


    /*
       প্রথমে saved index দেখি।
    */

    const saved =
        loadSavedIndex();


    if(saved){

        indexReady =
            true;


        searchBtn.disabled =
            false;


        searchBtn.textContent =
            "🔍 অনুসন্ধান";


        statusBox.style.display =
            "block";


        statusBox.className =
            "success";


        statusBox.textContent =
            `✓ ${voterIndex.length}টি PDF-এর Index প্রস্তুত আছে।`;


        return;

    }


    /*
       Saved index নেই।
       নতুন Index তৈরি।
    */

    await rebuildIndex();

}


/* =====================================================
   EXTRACT PDF TEXT
===================================================== */

async function extractPdfText(
    filename
){

    const url =
        getPdfUrl(filename);


    const loadingTask =
        pdfjsLib.getDocument({

            url:url,

            disableAutoFetch:false,

            disableStream:false

        });


    const pdf =
        await loadingTask.promise;


    let fullText =
        "";


    for(
        let pageNumber = 1;

        pageNumber <=
        pdf.numPages;

        pageNumber++
    ){

        const page =
            await pdf.getPage(
                pageNumber
            );


        const content =
            await page.getTextContent();


        const pageText =
            content.items

                .map(
                    item =>
                        item.str || ""
                )

                .join(" ");


        fullText +=
            pageText +
            "\n";

    }


    return fullText;

}


/* =====================================================
   REBUILD INDEX
===================================================== */

async function rebuildIndex(){

    if(indexBuilding){

        return;

    }


    indexBuilding =
        true;


    indexReady =
        false;


    searchBtn.disabled =
        true;


    searchBtn.textContent =
        "🔄 তথ্য প্রস্তুত হচ্ছে...";


    progressWrap.style.display =
        "block";


    progressBar.style.width =
        "0%";


    voterIndex =
        [];


    let successCount =
        0;


    let failedCount =
        0;


    for(
        let i = 0;

        i < PDF_FILES.length;

        i++
    ){

        const filename =
            PDF_FILES[i];


        const percent =
            Math.round(
                (
                    i /
                    PDF_FILES.length
                ) * 100
            );


        progressBar.style.width =
            percent + "%";


        statusBox.style.display =
            "block";


        statusBox.className =
            "";


        statusBox.textContent =
            `PDF পড়া হচ্ছে ${i + 1}/${PDF_FILES.length} — ${filename}`;


        try{

            const text =
                await extractPdfText(
                    filename
                );


            const normalized =
                normalizeText(
                    banglaToEnglishNumber(
                        text
                    )
                );


            voterIndex.push({

                filename:
                    filename,

                text:
                    normalized

            });


            successCount++;

        }

        catch(error){

            failedCount++;


            console.error(
                "PDF read error:",
                filename,
                error
            );

        }

    }


    progressBar.style.width =
        "100%";


    /*
       Index save
    */

    saveIndex();


    indexBuilding =
        false;


    if(
        voterIndex.length > 0
    ){

        indexReady =
            true;


        searchBtn.disabled =
            false;


        searchBtn.textContent =
            "🔍 অনুসন্ধান";


        statusBox.className =
            "success";


        statusBox.textContent =
            `✓ Index তৈরি সম্পন্ন। ${successCount}টি PDF প্রস্তুত হয়েছে।`;


        if(failedCount > 0){

            statusBox.textContent +=
                ` ${failedCount}টি PDF পড়া যায়নি।`;

        }

    }

    else{

        indexReady =
            false;


        searchBtn.disabled =
            true;


        searchBtn.textContent =
            "❌ Index তৈরি হয়নি";


        statusBox.className =
            "error";


        statusBox.textContent =
            "কোনো PDF পড়া যায়নি। GitHub PDF filename/path পরীক্ষা করুন।";

    }


    /*
       Progress কিছুক্ষণ দেখিয়ে
       তারপর hide করা হবে।
    */

    setTimeout(
        function(){

            progressWrap.style.display =
                "none";

        },
        1200
    );

}


/* =====================================================
   SEARCH
===================================================== */

function searchVoter(){

    if(!indexReady){

        statusBox.style.display =
            "block";


        statusBox.className =
            "error";


        statusBox.textContent =
            "তথ্য এখনো প্রস্তুত হচ্ছে। প্রস্তুত হওয়া পর্যন্ত অপেক্ষা করুন।";


        return;

    }


    const name =
        normalizeText(
            nameInput.value
        );


    const dob =
        normalizeText(
            banglaToEnglishNumber(
                dobInput.value
            )
        );


    if(
        !name &&
        !dob
    ){

        statusBox.style.display =
            "block";


        statusBox.className =
            "error";


        statusBox.textContent =
            "ভোটারের নাম অথবা জন্মতারিখ লিখুন।";


        return;

    }


    /*
       Search
    */

    const found =
        voterIndex.filter(
            function(item){

                const text =
                    item.text;


                if(
                    name &&
                    dob
                ){

                    return (
                        text.includes(name) &&
                        text.includes(dob)
                    );

                }


                if(name){

                    return text.includes(
                        name
                    );

                }


                if(dob){

                    return text.includes(
                        dob
                    );

                }


                return false;

            }
        );


    displayResults(found);

}

        results.innerHTML = `

                নাম ও জন্মতারিখ ঠিকভাবে লিখে আবার চেষ্টা করুন।

    statusBox.className =

    statusBox.textContent =

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* =====================================================
   OPEN PDF
===================================================== */

async function openPdf(filename){

    currentPdfFilename =
        filename;


    pdfWindow.style.display =
        "flex";


    pdfTitle.textContent =
        filename;


    pdfBody.innerHTML = `

        <div class="loading">
            PDF লোড হচ্ছে...
        </div>

    `;


    try{

        const pdf =
            await pdfjsLib
                .getDocument(
                    getPdfUrl(filename)
                )
                .promise;


        pdfBody.innerHTML =
            "";


        for(
            let pageNumber = 1;

            pageNumber <=
            pdf.numPages;

            pageNumber++
        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );


            const viewport =
                page.getViewport({
                    scale:1.5
                });


            const pageDiv =
                document.createElement(
                    "div"
                );


            pageDiv.className =
                "pdfPage";


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            pageDiv.appendChild(
                canvas
            );


            const watermark =
                document.createElement(
                    "div"
                );


            watermark.className =
                "watermark";


            watermark.innerHTML = `
                আলী ইসলাম<br>
                উদ্যোক্তা<br>
                ০৩ নং পাঁচলাইশ ওয়ার্ড
            `;


            pageDiv.appendChild(
                watermark
            );


            pdfBody.appendChild(
                pageDiv
            );


            const context =
                canvas.getContext(
                    "2d"
                );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }

    }

    catch(error){

        console.error(
            "PDF viewer error:",
            error
        );


        pdfBody.innerHTML = `

            <div class="loading">

                ❌ PDF লোড করা যাচ্ছে না।

                <br><br>

                ${escapeHtml(
                    filename
                )}

            </div>

        `;

    }

}


/* =====================================================
   PRINT
===================================================== */

function printCurrentPdf(){

    const pages =
        document.querySelectorAll(
            "#pdfBody .pdfPage"
        );


    if(
        pages.length === 0
    ){

        alert(
            "PDF সম্পূর্ণ লোড হওয়ার পর প্রিন্ট করুন।"
        );

        return;

    }


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if(!printWindow){

        alert(
            "Print window খুলতে পারেনি। Browser popup অনুমতি দিন।"
        );

        return;

    }


    printWindow.document.open();


    printWindow.document.write(`

<html lang="bn">

<head>

<meta charset="UTF-8">

<title>
${escapeHtml(currentPdfFilename)}
</title>

<style>

@page{

    size:A4;

    margin:0;

}


html,
body{

    margin:0;

}


.printPage{

.printWatermark{

        translate(-50%,-50%)

    color:
        rgba(30,64,175,.18);

    font-family:
        "Noto Sans Bengali",

    pages.forEach(
        function(page){

            const canvas =
                page.querySelector(

                );


            if(!canvas){

                return;

            }


            const image =
                canvas.toDataURL(
                    "image/png"
                );


            printWindow.document.write(`

                <div class="printPage">

                    <img
                        src="${image}"
                    >


                    <div class="printWatermark">

                        আলী ইসলাম<br>
                        উদ্যোক্তা<br>
                        ০৩ নং পাঁচলাইশ ওয়ার্ড

                    </div>

                </div>

            `);

        }
    );


    printWindow.document.write(`

</body>

</html>

`);


    printWindow.document.close();


    setTimeout(
        function(){

            printWindow.focus();

            printWindow.print();

        },

    );

}
