    color:#eee;

.header{
    background:linear-gradient(135deg,#0d6efd,#084298);
    color:#fff;
    text-align:center;
    padding:24px 15px;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:6px 0 0;
}

/* CONTAINER */
.container{
    max-width:1050px;
    margin:22px auto;
    padding:0 15px;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.mode-btn{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    cursor:pointer;
    background:#fff;
    color:#222;
}

.dark .mode-btn{
    background:#252d36;
    color:#fff;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#fff;
    border-radius:10px;
    padding:14px;
    text-align:center;
    box-shadow:0 3px 12px #00000012;
}

.dark .stat,
.dark .search-box,
.dark .info-card{
    background:#1d2630;
    color:#eee;
}

.stat b{
    display:block;
    font-size:21px;
    margin-top:4px;
}

/* SEARCH BOX */
.search-box{
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 15px #00000012;
}

.search-wrapper{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccd2d8;
    border-radius:7px;
    font-size:16px;
    background:inherit;
    color:inherit;
}

.search-btn,
.clear-btn{
    border:0;
    border-radius:7px;
    padding:12px 20px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn{
    background:#0d6efd;
    color:#fff;
}

.search-btn:disabled{
    background:#999;
}

.clear-btn{
    background:#6c757d;
    color:#fff;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

#status{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

/* PROGRESS */
.progress{
    height:7px;
    background:#e5e7eb;
    border-radius:5px;
    overflow:hidden;
    margin-top:8px;
}

.progress i{
    display:block;
    height:100%;
    width:0;
    background:#0d6efd;
    transition:.2s;
}

/* RESULTS */
.results-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0 10px;
}

.info-card{
    position:relative;
    overflow:hidden;
    background:#fff;
    border-radius:12px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 3px 15px #00000012;
    border-left:5px solid #0d6efd;
}

.info-card h3{
    margin:0 0 14px;
    color:#0d6efd;
    border-bottom:1px solid #ddd;
    padding-bottom:9px;
}

.info-row{
    display:grid;
    grid-template-columns:150px 1fr;
    gap:10px;
    padding:6px 0;
    border-bottom:1px dashed #ddd;
}

.info-label{
    font-weight:bold;
}

.info-value{
    word-break:break-word;
}

/* BUTTONS */
.button-area{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:16px;
}

.print-btn,
.copy-btn,
.pdf-btn{
    border:0;
    color:#fff;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;

.copy-btn{

.pdf-btn{

}

    font-size:11px;

.print-watermark{

.empty{

    border-radius:12px;
    padding:25px;
    text-align:center;
}

.dark .empty{

/* PRINT */
.print-header,
.print-footer,
.signature{
    display:none;
}

@page{
    size:A5 portrait;
    margin:10mm;
}

@media print{

    body{
        background:#fff!important;
    }

    body *{
        visibility:hidden!important;
    }

    .print-area,
    .print-area *{
        visibility:visible!important;
    }

    .print-area{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        min-height:178mm;
        background:#fff!important;
        color:#000!important;
        border:1px solid #222!important;
        border-radius:0!important;
        box-shadow:none!important;
        padding:10mm!important;
        margin:0!important;
    }

    .button-area,
    .watermark{
        display:none!important;
    }

    /* BEAUTIFUL WATERMARK */

    .print-watermark{
        display:block!important;
        position:absolute;

        left:50%;
        top:50%;

        transform:
            translate(-50%,-50%)
            rotate(-28deg);

        width:92%;

        text-align:center;

        z-index:0;
        pointer-events:none;

        color:#555;

        opacity:.10;

        font-weight:800;

        line-height:1.45;

        letter-spacing:1px;

        white-space:nowrap;
    }

    .print-watermark .wm-name{
        font-size:27px;
    }

    .print-watermark .wm-role{
        font-size:19px;
    }

    .print-watermark .wm-ward{

    }

    .print-header{
        display:block!important;
        text-align:center;

        padding-bottom:7px;

        margin-bottom:10px;
    }

    .print-header h2,
    .print-header h3,

        font-size:19px;
    }

    .print-header h3{

    }

    .print-header p{

    }

    }

        font-size:12px;
        color:#000;
    }

    .print-footer{
        display:block!important;

    }

    .signature{
        display:flex!important;
        justify-content:space-between;
        margin-top:13mm;
        font-size:10px;
    }

/* =========================================================

const INDEX_KEY =

let voterIndex = [];

/* =========================================================
   BANGLA DIGITS
========================================================= */

const en = "0123456789";

const bn = "০১২৩৪৫৬৭৮৯";


function convertDigits(s,toBangla=true){

    if(!s) return "";

    return String(s)

        .replace(
            /[0-9]/g,
            d => toBangla
                ? bn[en.indexOf(d)]
                : d
        )

        .replace(
            /[০-৯]/g,
            d => toBangla
                ? d
                : d
        );
}


/* =========================================================
   CLEAN TEXT
========================================================= */

function cleanText(t){

    return String(t || "")

        .replace(/\u200c/g,"")

        .replace(/\u200d/g,"")

        .replace(/\u00a0/g," ")

        .replace(/\s+/g," ")

        .trim();
}


/* =========================================================
   PDF BANGLA FIX
========================================================= */

function fixPdfBangla(t){

    let r = String(t || "");

    const map = {

        "োভাটার":"ভোটার",

        "সামী":"স্বামী",

        "িপতা":"পিতা",

        "িঠকানা":"ঠিকানা",

        "োপশা":"পেশা",

        "জন তািরখ":"জন্ম তারিখ",

        "জন্ম তািরখ":"জন্ম তারিখ",

        "গৃিহনী":"গৃহিণী"

    };

    for(const k in map){

        r = r.split(k).join(map[k]);

    }

    return r;
}


/* =========================================================
   SEARCH NORMALIZATION
========================================================= */

function normalizeSearch(t){

    return cleanText(
        fixPdfBangla(t)
    )

    .toLowerCase()

    .replace(
        /[।,:;'"“”‘’\-_/\\()[\]{}]/g,
        " "
    )

    .replace(/\s+/g," ")

    .trim();
}


/* =========================================================
   DATE
========================================================= */

function digitsOnlyDate(t){

    return String(t || "")

        .replace(/\s/g,"")

        .replace(
            /[০-৯]/g,
            d => en[bn.indexOf(d)]
        )

        .replace(/[^0-9]/g,"");
}


/* =========================================================
   SIMILARITY
========================================================= */

function similarity(a,b){

    a = normalizeSearch(a);

    b = normalizeSearch(b);

    if(!a || !b) return 0;

    const m = a.length;

    const n = b.length;

    const dp =
        Array.from(
            {length:m+1},
            () => Array(n+1).fill(0)
        );


    for(let i=0;i<=m;i++)
        dp[i][0]=i;


    for(let j=0;j<=n;j++)
        dp[0][j]=j;


    for(let i=1;i<=m;i++){

        for(let j=1;j<=n;j++){

            dp[i][j] = Math.min(

                dp[i-1][j]+1,

                dp[i][j-1]+1,

                dp[i-1][j-1] +
                (a[i-1] === b[j-1] ? 0 : 1)

            );

        }

    }


    return 1 -
        dp[m][n] /
        Math.max(m,n);
}


/* =========================================================
   NAME MATCH
========================================================= */

function nameMatches(q,n){

    q = normalizeSearch(q);

    n = normalizeSearch(n);

    if(!q || !n)
        return false;


    if(q === n)
        return true;


    if(n.includes(q))
        return true;


    if(q.includes(n))
        return true;


    const qw = q.split(" ");

    const nw = n.split(" ");


    return qw.some(

        x => x.length >= 2 &&
        nw.some(
            y =>
                y === x ||
                similarity(x,y) >= .72
        )

    )

    ||

    similarity(q,n) >= .72;
}


/* =========================================================
   BANGLA UNICODE ORDER
========================================================= */

function normalizeBengaliOrder(text){

    text = String(text || "");


    const leftMarks =
        "\u09BF\u09C7\u09C8\u09CB\u09CC";


    text = text.replace(

        new RegExp(
            "^(["+
            leftMarks+
            "])([\\u0980-\\u09FF])",
            "g"
        ),

        "$2$1"

    );


    text = text.replace(

        new RegExp(
            "([\\s:;,.])(["+
            leftMarks+
            "])([\\u0980-\\u09FF])",
            "g"
        ),

        "$1$3$2"

    );


    const fixes = [

        [/োভাটার/g,"ভোটার"],

        [/িপতা/g,"পিতা"],

        [/সামী/g,"স্বামী"],

        [/িঠকানা/g,"ঠিকানা"],

        [/োপশা/g,"পেশা"],

        [/জন তািরখ/g,"জন্ম তারিখ"],

        [/জন্ম তািরখ/g,"জন্ম তারিখ"],

        [/িববাহ/g,"বিবাহ"],

        [/গৃিহনী/g,"গৃহিনী"],

        [/ছাত\/ছাতী/g,"ছাত্র/ছাত্রী"],

        [/োমাঃ/g,"মোঃ"],

        [/োমাহামদ/g,"মোহাম্মদ"],

        [/িদলুআরা/g,"দিলুআরা"],

        [/োখারেশদ/g,"খোরশেদ"],

        [/সােহদা/g,"সাহেদা"],

        [/রিশদ/g,"রশিদ"],

        [/হািস/g,"হাসি"],

        [/নর আয়শা/g,"নুর আয়শা"],

        [/োরহানা/g,"রোহানা"],

        [/িফেরাজা/g,"ফিরোজা"],

        [/িনাত/g,"মিনাত"],

        [/াজার/g,"বাজার"]

    ];


    for(
        const [a,b]
        of fixes
    ){

        text =
            text.replace(a,b);

    }


    return text
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   COORDINATE TEXT
========================================================= */

function makeCoordinateText(items){

    const arr = items

        .filter(
            i =>
                i.str &&
                i.str.trim()
        )

        .map(i => ({

            str:i.str.trim(),

            x:Number(
                i.transform?.[4] || 0
            ),

            y:Number(
                i.transform?.[5] || 0
            ),

            w:Number(
                i.width || 0
            ),

            h:Number(
                i.height || 0
            )

        }));


    if(!arr.length)
        return "";


    const xs =
        arr
        .map(o=>o.x)
        .sort((a,b)=>a-b);


    const gaps =
        xs.map(
            (x,i)=>
                i
                ? x-xs[i-1]
                : 0
        );


    const candidates =
        gaps

        .map(
            (g,i)=>({
                g,
                i
            })
        )

        .filter(
            o=>o.g>18
        )

        .sort(
            (a,b)=>b.g-a.g
        )

        .slice(0,2)

        .sort(
            (a,b)=>a.i-b.i
        );


    let cuts =
        candidates

        .map(
            o =>
                (xs[o.i]+
                 xs[o.i-1])/2
        )

        .sort(
            (a,b)=>a-b
        );


    if(cuts.length < 2){

        const min = xs[0];

        const max = xs[xs.length-1];

        const step =
            (max-min)/3;

        cuts = [

            min+step,

            min+step*2

        ];

    }


    const cols=[
        [],
        [],
        []
    ];


    for(const o of arr){

        const c =
            o.x < cuts[0]
                ? 0
                : o.x < cuts[1]
                    ? 1
                    : 2;

        cols[c].push(o);

    }


    function colText(col){

        col.sort(
            (a,b)=>
                b.y-a.y ||
                a.x-b.x
        );


        const lines=[];


        for(const o of col){

            let line =
                lines.find(
                    l =>
                        Math.abs(l.y-o.y)
                        <= Math.max(
                            3,
                            o.h*.55
                        )
                );


            if(!line){

                line={
                    y:o.y,
                    items:[]
                };

                lines.push(line);

            }


            line.items.push(o);

        }


        lines.sort(
            (a,b)=>b.y-a.y
        );


        return lines

            .map(

                l =>
                    l.items

                    .sort(
                        (a,b)=>
                            a.x-b.x
                    )

                    .map(
                        o=>o.str
                    )

                    .join(" ")

            )

            .join(" ");

    }


    return cols

        .map(colText)

        .filter(Boolean)

        .join(" ");

}


/* =========================================================
   PERSON BLOCKS
========================================================= */

function extractPersonBlocks(text){

    text =
        normalizeBengaliOrder(
            fixPdfBangla(text)
        );


    text =
        text.replace(
            /([০-৯0-9]{1,6})\s*\.\s*/g,
            "\n$1. "
        );


    return text

        .split(
            /\n(?=[০-৯0-9]{1,6}\.)/
        )

        .map(cleanText)

        .filter(
            x =>
                /^[০-৯0-9]{1,6}\./
                .test(x)
        );
}


/* =========================================================
   PARSE VOTER
========================================================= */

function parseVoterData(block){

    block =
        normalizeBengaliOrder(
            fixPdfBangla(
                cleanText(block)
            )
        );


    const sm =
        block.match(
            /^([০-৯0-9]{1,6})\./
        );


    const stop =
        "(?=ভোটার|ো?ভোটার|পিতা|ি?পিতা|স্বামী|সামী|মাতা|পেশা|ো?পেশা|জন্ম|ঠিকানা|ি?ঠিকানা|$)";


    let name =
        (
            block.match(
                new RegExp(
                    "নাম\\s*[:：]?\\s*(.*?)\\s*"+
                    stop,
                    "i"
                )
            ) || []
        )[1] || "";


    if(!name){

        let x =
            block.replace(
                /^[০-৯0-9]{1,6}\.\s*/,
                ""
            );


        let p =
            x.search(
                /ভোটার|ো?ভোটার|পিতা|ি?পিতা|স্বামী|সামী|মাতা|পেশা|ো?পেশা|জন্ম|ঠিকানা|ি?ঠিকানা/
            );


        name =
            p>0
                ? x.slice(0,p)
                : x
                    .split(" ")
                    .slice(0,5)
                    .join(" ");

    }


    const get =
        re =>
            (
                block.match(re)||[]
            )[1] || "";


    return {

        serial:
            sm
                ? sm[1]
                : "",


        name:
            normalizeBengaliOrder(
                cleanText(name)
            ),


        voterNo:
            get(
                /(?:ভোটার|োভাটার)\s*নং\s*[:：-]?\s*([০-৯0-9]+)/i
            ),


        dob:
            get(
                /(?:জন্ম\s*তারিখ|জন\s*তািরখ|জন্ম\s*তািরখ)\s*[:：]?\s*([০-৯0-9]{1,2}[\/\-.][০-৯0-9]{1,2}[\/\-.][০-৯0-9]{2,4})/i
            ),


        parent:
            get(
                /(?:পিতা|ি?পিতা|স্বামী|সামী)\s*[:：]?\s*(.*?)\s*(?=মাতা|পেশা|জন্ম|ঠিকানা|$)/i
            ),


        mother:
            get(
                /মাতা\s*[:：]?\s*(.*?)\s*(?=পেশা|জন্ম|ঠিকানা|$)/i
            ),


        occupation:
            get(
                /(?:পেশা|ো?পেশা)\s*[:：]?\s*(.*?)\s*(?=জন্ম|ঠিকানা|$)/i
            ),


        address:
            get(
                /(?:ঠিকানা|ি?ঠিকানা)\s*[:：]?\s*(.*)$/i
            )

    };
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(v){

    return String(v ?? "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =========================================================
   BUILD INDEX
========================================================= */

async function buildIndex(force=false){

    if(!force){

        try{

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        INDEX_KEY
                    ) || "null"
                );


            if(saved?.length){

                voterIndex = saved;

                indexReady = true;

                updateStats();

                return;

            }

        }catch(e){}

    }


    const status =
        document.getElementById(
            "status"
        );


    const bar =
        document.getElementById(
            "progressBar"
        );


    const btn =
        document.getElementById(
            "searchBtn"
        );


    btn.disabled = true;


    voterIndex = [];


    document.getElementById(
        "indexStatus"
    ).textContent =
        "তৈরি হচ্ছে";


    for(
        let i=0;
        i<pdfList.length;
        i++
    ){

        const [file,url] =
            pdfList[i];


        status.textContent =
            `📖 Index তৈরি হচ্ছে: ${file} — ${i+1}/${pdfList.length}`;


        bar.style.width =
            (
                (i+1) /
                pdfList.length *
                100
            ) + "%";


        try{

            const pdf =
                await pdfjsLib
                    .getDocument(url)
                    .promise;


            for(
                let pageNo=1;
                pageNo<=pdf.numPages;
                pageNo++
            ){

                try{

                    const page =
                        await pdf.getPage(
                            pageNo
                        );


                    const tc =
                        await page
                            .getTextContent();


                    const text =
                        makeCoordinateText(
                            tc.items
                        );


                    const blocks =
                        extractPersonBlocks(
                            text
                        );


                    for(
                        const block
                        of blocks
                    ){

                        const v =
                            parseVoterData(
                                block
                            );


                        if(v.name){

                            v.pdfUrl =
                                url+
                                "#page="+
                                pageNo;


                            v.page =
                                pageNo;


                            v.file =
                                file;


                            voterIndex.push(v);

                        }

                    }

                }catch(e){

                    console.warn(
                        "page error",
                        file,
                        pageNo,
                        e
                    );

                }

            }

        }catch(e){

            console.warn(
                "PDF error",
                file,
                e
            );

        }

    }


    try{

        localStorage.setItem(
            INDEX_KEY,
            JSON.stringify(
                voterIndex
            )
        );

    }catch(e){}


    indexReady = true;

    btn.disabled = false;

    updateStats();


    status.textContent =
        `✅ Index তৈরি শেষ — ${convertDigits(voterIndex.length)} টি রেকর্ড প্রস্তুত।`;


    document.getElementById(
        "indexStatus"
    ).textContent =
        "প্রস্তুত";


    bar.style.width =
        "100%";
}

/* =========================================================
   SEARCH
========================================================= */

function performSearch(){

    if(!indexReady){

        alert(
            "প্রথমে Index তৈরি হচ্ছে/করতে হবে।"
        );

        return;
    }


    const nq =
        normalizeSearch(
            document.getElementById(
                "nameInput"
            ).value
        );


    const dq =
        digitsOnlyDate(
            document.getElementById(
                "dobInput"
            ).value
        );


    if(!nq && !dq){

        alert(
            "নাম অথবা জন্ম তারিখ লিখুন।"
        );

        return;
    }


    let results =
        voterIndex.filter(v => {

            const okName =
                !nq ||
                nameMatches(
                    nq,
                    v.name
                );


            const vd =
                digitsOnlyDate(
                    v.dob
                );


            const okDob =
                !dq ||
                vd === dq ||
                vd.includes(dq) ||
                dq.includes(vd);


            return okName && okDob;

        });


    /* REMOVE DUPLICATES */

    const seen =
        new Set();


    results =
        results.filter(v => {

            const k =
                v.voterNo ||
                v.name+
                "|"+
                v.dob+
                "|"+
                v.serial;


            if(seen.has(k))
                return false;


            seen.add(k);

            return true;

        });


    document.getElementById(
        "resultCount"
    ).textContent =
        convertDigits(
            results.length
        );


    document.getElementById(
        "resultSummary"
    ).textContent =
        `${convertDigits(results.length)} টি ফলাফল`;


    document.getElementById(
        "status"
    ).textContent =
        results.length

        ? `✅ ${convertDigits(results.length)} টি ফলাফল পাওয়া গেছে।`

        : "❌ কোনো ফলাফল পাওয়া যায়নি।";


    document.getElementById(
        "results"
    ).innerHTML =

        results.length

        ?

        results
            .map(renderResult)
            .join("")

        :

        `

        <div class="empty">

            <h3>
                😔 কোনো ফলাফল পাওয়া যায়নি
            </h3>

            <p>
                নামের বানান বা জন্ম তারিখ
                পরীক্ষা করে আবার চেষ্টা করুন।
            </p>

        </div>

        `;

}

/* =========================================================
   SINGLE A5 PRINT
========================================================= */

function printSingleResult(id){

    const card =
        document.getElementById(id);


    if(!card)
        return;


    document
        .querySelectorAll(
            ".print-area"
        )
        .forEach(
            x =>
                x.classList
                 .remove(
                    "print-area"
                 )
        );


    card.classList.add(
        "print-area"
    );


    window.print();


    setTimeout(
        () =>
            card.classList.remove(
                "print-area"
            ),
        1000
    );
}
