// ======================================================
// বাংলা / ইংরেজি সংখ্যা
// ======================================================

function convertDigits(str,toBangla=true){

    const bn="০১২৩৪৫৬৭৮৯";
    const en="0123456789";

    return String(str).replace(/[০-৯0-9]/g,function(ch){

        if(toBangla){

            const index=en.indexOf(ch);

            return index>=0 ? bn[index] : ch;

        }else{

            const index=bn.indexOf(ch);

            return index>=0 ? en[index] : ch;

        }

    });

}


// ======================================================
// TEXT CLEAN
// ======================================================

function cleanText(text){

    return String(text || "")
        .replace(/\u00A0/g," ")
        .replace(/\s+/g," ")
        .trim();

}


// ======================================================
// PDF বাংলা TEXT ঠিক করা
// ======================================================

function fixPdfBangla(text){

    let s=cleanText(text);


    const replacements={

        "োভাটার":"ভোটার",

        "সামী":"স্বামী",

        "িপতা":"পিতা",

        "িঠকানা":"ঠিকানা",

        "োপশা":"পেশা",

        "জন তািরখ":"জন্ম তারিখ",

        "জন্ম তািরখ":"জন্ম তারিখ",

        "জন্ম তারিখ":"জন্ম তারিখ",

        "গৃিহনী":"গৃহিণী",

        "ছাত/ছাতী":"ছাত্র/ছাত্রী",

        "ওয়ােজদিয়া":"ওয়াজেদিয়া",

        "ওয়ােজিদয়া":"ওয়াজেদিয়া",

        "বায়িজদ":"বায়েজিদ",

        "চটগাম":"চট্টগ্রাম",

        "োজলা":"জেলা",

        "উপেজলা":"উপজেলা",

        "ওয়াডর":"ওয়ার্ড"

    };


    for(const wrong in replacements){

        s=s.split(wrong).join(
            replacements[wrong]
        );

    }


    return s;

}


// ======================================================
// SEARCH NORMALIZE
// ======================================================

function normalizeSearch(text){

    return fixPdfBangla(text)
        .toLowerCase()
        .normalize("NFC")
        .replace(/[\u200C\u200D]/g,"")
        .replace(/[.,:;|()[\]{}\-]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


// ======================================================
// LEVENSHTEIN
// ======================================================

function similarity(a,b){

    a=normalizeSearch(a);
    b=normalizeSearch(b);

    if(!a || !b) return 0;

    if(a===b) return 1;

    if(a.includes(b) || b.includes(a))
        return .95;


    const matrix=[];


    for(let i=0;i<=a.length;i++)
        matrix[i]=[i];


    for(let j=0;j<=b.length;j++)
        matrix[0][j]=j;


    for(let i=1;i<=a.length;i++){

        for(let j=1;j<=b.length;j++){

            const cost=
                a[i-1]===b[j-1]
                ?0
                :1;


            matrix[i][j]=Math.min(

                matrix[i-1][j]+1,

                matrix[i][j-1]+1,

                matrix[i-1][j-1]+cost

            );

        }

    }


    const distance=
        matrix[a.length][b.length];


    return 1 -
        distance/
        Math.max(a.length,b.length);

}


// ======================================================
// NAME MATCH
// ======================================================

function nameMatches(query,name){

    if(!query || !name)
        return false;


    const q=normalizeSearch(query);
    const n=normalizeSearch(name);


    if(n.includes(q) || q.includes(n))
        return true;


    if(similarity(q,n)>=.72)
        return true;


    const qw=q.split(" ");
    const nw=n.split(" ");


    for(const a of qw){

        for(const b of nw){

            if(similarity(a,b)>=.75)
                return true;

        }

    }


    return false;

}


// ======================================================
// PARSE VOTER
// ======================================================

function parseVoterData(block){

    const text=fixPdfBangla(block);


    const serialMatch=
        text.match(
            /^([০-৯0-9]{1,6})\s*\./
        );


    const nameMatch=
        text.match(
            /নাম\s*[:：]?\s*(.*?)\s*(?=ভোটার\s*নং|পিতা|স্বামী|মাতা|পেশা|জন্ম\s*তারিখ|ঠিকানা|$)/i
        );


    const voterMatch=
        text.match(
            /ভোটার\s*নং\s*[:：-]?\s*([০-৯0-9]+)/i
        );


    const fatherMatch=
        text.match(
            /(?:পিতা|স্বামী)\s*[:：]?\s*(.*?)\s*(?=মাতা|পেশা|জন্ম\s*তারিখ|ঠিকানা|$)/i
        );


    const motherMatch=
        text.match(
            /মাতা\s*[:：]?\s*(.*?)\s*(?=পেশা|জন্ম\s*তারিখ|ঠিকানা|$)/i
        );


    const occupationMatch=
        text.match(
            /পেশা\s*[:：]?\s*(.*?)\s*(?=জন্ম\s*তারিখ|ঠিকানা|$)/i
        );


    const dobMatch=
        text.match(
            /জন্ম\s*তারিখ\s*[:：]?\s*([০-৯0-9]{1,2}[\/.-][০-৯0-9]{1,2}[\/.-][০-৯0-9]{4})/i
        );


    const addressMatch=
        text.match(
            /ঠিকানা\s*[:：]?\s*(.+)$/i
        );


    return{

        name:nameMatch
            ?nameMatch[1].trim()
            :"N/A",

        serial:serialMatch
            ?convertDigits(serialMatch[1],true)
            :"N/A",

        voterNo:voterMatch
            ?convertDigits(voterMatch[1],true)
            :"N/A",

        father:fatherMatch
            ?fatherMatch[1].trim()
            :"N/A",

        mother:motherMatch
            ?motherMatch[1].trim()
            :"N/A",

        occupation:occupationMatch
            ?occupationMatch[1].trim()
            :"N/A",

        dob:dobMatch
            ?convertDigits(dobMatch[1],true)
            :"N/A",

        address:addressMatch
            ?addressMatch[1].trim()
            :"N/A"

    };

}


// ======================================================
// PERSON BLOCK
// ======================================================

function extractPersonBlocks(pageText){

    const text=cleanText(pageText);


    /*
    PDF-এ প্রতিটি ভোটার সাধারণত:

    ০০০১. নাম:
    ০০০২. নাম:
    ০০০৩. নাম:

    */

    const blocks=
        text.split(
            /(?=[০-৯0-9]{1,6}\s*\.\s*নাম\s*[:：]?)/i
        );


    return blocks
        .map(x=>x.trim())
        .filter(x=>{

            return (
                x &&
                /নাম\s*[:：]?/i.test(
                    fixPdfBangla(x)
                )
            );

        });

}


// ======================================================
// ESCAPE HTML
// ======================================================

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// ======================================================
// SEARCH
// ======================================================

async function performSearch(){

    const nameQuery=
        document.getElementById(
            "nameInput"
        ).value.trim();


    const dobQuery=
        document.getElementById(
            "dobInput"
        ).value.trim();


    const results=
        document.getElementById(
            "results"
        );


    const status=
        document.getElementById(
            "status"
        );


    const searchBtn=
        document.getElementById(
            "searchBtn"
        );


    results.innerHTML="";


    if(!nameQuery && !dobQuery){

        status.innerText=
            "অনুগ্রহ করে নাম অথবা জন্ম তারিখ লিখুন।";

        return;

    }


    searchBtn.disabled=true;


    status.innerHTML=`

        <div class="loading">

            <div class="spinner"></div>

            PDF ফাইলসমূহে তথ্য খোঁজা হচ্ছে...

        </div>

    `;


    let matchCount=0;

    const found=new Set();


    const dobBn=
        normalizeSearch(
            convertDigits(dobQuery,true)
        );


    const dobEn=
        normalizeSearch(
            convertDigits(dobQuery,false)
        );


    // ==================================================
    // PDF LOOP
    // ==================================================

    for(
        let fileIndex=0;
        fileIndex<pdfList.length;
        fileIndex++
    ){

        const pdfInfo=
            pdfList[fileIndex];


        status.innerHTML=`

            <div class="loading">

                <div class="spinner"></div>

                ফাইল ${convertDigits(fileIndex+1,true)}
                / ${convertDigits(pdfList.length,true)}
                পরীক্ষা করা হচ্ছে...

            </div>

        `;


        try{

            const loadingTask=
                pdfjsLib.getDocument({
                    url:pdfInfo.url
                });


            const pdf=
                await loadingTask.promise;


            // ==========================================
            // PAGE LOOP
            // ==========================================

            for(
                let pageNum=1;
                pageNum<=pdf.numPages;
                pageNum++
            ){

                const page=
                    await pdf.getPage(pageNum);


                const textContent=
                    await page.getTextContent();


                const pageText=
                    textContent.items
                        .map(item=>item.str)
                        .join(" ");


                if(!pageText.trim())
                    continue;


                const blocks=
                    extractPersonBlocks(
                        pageText
                    );


                // ======================================
                // PERSON LOOP
                // ======================================

                for(const block of blocks){

                    const data=
                        parseVoterData(block);


                    if(data.name==="N/A")
                        continue;


                    // NAME
                    let nameOK=true;


                    if(nameQuery){

                        nameOK=
                            nameMatches(
                                nameQuery,
                                data.name
                            );

                    }


                    // DOB
                    let dobOK=true;


                    if(dobQuery){

                        const actualDob=
                            normalizeSearch(
                                data.dob
                            );


                        dobOK=
                            actualDob===dobBn ||
                            actualDob===dobEn ||
                            actualDob.includes(dobBn) ||
                            actualDob.includes(dobEn);

                    }


                    if(!nameOK || !dobOK)
                        continue;


                    // DUPLICATE
                    const key=
                        data.voterNo!=="N/A"
                        ?data.voterNo
                        :data.name+"|"+data.dob;


                    if(found.has(key))
                        continue;


                    found.add(key);

                    matchCount++;


                    const card=
                        document.createElement(
                            "div"
                        );


                    card.className=
                        "info-card";


                    card.innerHTML=`

                        <div class="result-badge">

                            ফলাফল নং:
                            ${convertDigits(
                                matchCount,
                                true
                            )}

                        </div>


                        <div class="watermark">

                            আলী ইসলাম<br>

                            উদ্যোক্তা,
                            ০৩ নং পাঁচলাইশ ওয়ার্ড

                        </div>


                        <div class="card-details">

                            <div class="field-row">

                                <strong>নাম:</strong>

                                ${escapeHTML(
                                    data.name
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    সিরিয়াল নাম্বার:
                                </strong>

                                ${escapeHTML(
                                    data.serial
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    ভোটার নং:
                                </strong>

                                ${escapeHTML(
                                    data.voterNo
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    জন্ম তারিখ:
                                </strong>

                                ${escapeHTML(
                                    data.dob
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    পিতা/স্বামী:
                                </strong>

                                ${escapeHTML(
                                    data.father
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    মাতা:
                                </strong>

                                ${escapeHTML(
                                    data.mother
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    পেশা:
                                </strong>

                                ${escapeHTML(
                                    data.occupation
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    এলাকা:
                                </strong>

                                ${escapeHTML(
                                    data.address
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    ওয়ার্ড:
                                </strong>

                                ওয়ার্ড নং-০৩

                            </div>

                        </div>


                        <div style="
                            text-align:center;
                            position:relative;
                            z-index:3;
                        ">

                            <a
                                class="pdf-link-btn"
                                href="${pdfInfo.url}#page=${pageNum}"
                                target="_blank"
                            >

                                📄 মূল PDF দেখুন
                                (পৃষ্ঠা
                                ${convertDigits(
                                    pageNum,
                                    true
                                )})

                            </a>

                        </div>

                    `;


                    results.appendChild(card);

                }

            }


        }catch(error){

            console.error(
                "PDF Error:",
                pdfInfo.url,
                error
            );

        }

    }


    // ==================================================
    // FINAL RESULT
    // ==================================================

    if(matchCount>0){

        status.innerText=
            `সর্বমোট ${convertDigits(
                matchCount,
                true
            )}টি তথ্য পাওয়া গেছে।`;

    }else{

        status.innerText=
            "কোনো তথ্য পাওয়া যায়নি।";


        results.innerHTML=`

            <div class="no-result">

                ❌ দুঃখিত!

                <br><br>

                আপনার দেওয়া নাম অথবা জন্ম তারিখের
                সাথে কোনো তথ্য পাওয়া যায়নি।

            </div>

        `;

    }


    searchBtn.disabled=false;

}


// ======================================================
// ENTER KEY
// ======================================================

document
.getElementById("nameInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter")
            performSearch();

    }
);


document
.getElementById("dobInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter")
            performSearch();

    }
);

</script>
