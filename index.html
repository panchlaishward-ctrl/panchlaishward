/* =====================================================
   INDEX
===================================================== */

const INDEX_KEY =

/* =====================================================
   DIGIT CONVERTER
===================================================== */

const en = "0123456789";
const bn = "০১২৩৪৫৬৭৮৯";

function convertDigits(
    s,
    toBangla = true
){

    if(!s) return "";

    return String(s)

    .replace(
        /[0-9]/g,
        d => toBangla
            ? bn[en.indexOf(d)]
            : d
    )

    .replace(
        /[০-৯]/g,
        d => toBangla
            ? d
            : en[bn.indexOf(d)]
    );
}


/* =====================================================
   CLEAN TEXT
===================================================== */

function cleanText(t){

    return String(t || "")

    .replace(/\u200c/g,"")

    .replace(/\u200d/g,"")

    .replace(/\u00a0/g," ")

    .replace(/\s+/g," ")

    .trim();
}


/* =====================================================
   BANGLA PDF FIX
===================================================== */

function fixPdfBangla(t){

    let r = String(t || "");

    const map = {

        "োভাটার":"ভোটার",

        "সামী":"স্বামী",

        "িপতা":"পিতা",

        "িঠকানা":"ঠিকানা",

        "োপশা":"পেশা",

        "জন তািরখ":"জন্ম তারিখ",

        "জন্ম তািরখ":"জন্ম তারিখ",

        "গৃিহনী":"গৃহিণী"

    };

    for(
        const k in map
    ){

        r =
        r.split(k)
         .join(map[k]);

    }

    return r;
}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeSearch(t){

    return cleanText(
        fixPdfBangla(t)
    )

    .toLowerCase()

    .replace(
        /[।,:;'"“”‘’\-_/\\()[\]{}]/g,
        " "
    )

    .replace(/\s+/g," ")

    .trim();
}


/* =====================================================
   DATE NORMALIZE
===================================================== */

function digitsOnlyDate(t){

    return convertDigits(
        String(t || "")
        .replace(/\s/g,""),
        false
    )

    .replace(
        /[^0-9]/g,
        ""
    );
}


/* =====================================================
   LEVENSHTEIN
===================================================== */

function similarity(a,b){

    a = normalizeSearch(a);
    b = normalizeSearch(b);

    if(!a || !b)
        return 0;

    const m = a.length;
    const n = b.length;

    const dp =
        Array.from(
            {length:m+1},
            () =>
            Array(n+1).fill(0)
        );

    for(
        let i=0;
        i<=m;
        i++
    )
        dp[i][0] = i;

    for(
        let j=0;
        j<=n;
        j++
    )
        dp[0][j] = j;

    for(
        let i=1;
        i<=m;
        i++
    ){

        for(
            let j=1;
            j<=n;
            j++
        ){

            dp[i][j] =
                Math.min(

                    dp[i-1][j] + 1,

                    dp[i][j-1] + 1,

                    dp[i-1][j-1] +
                    (
                        a[i-1] === b[j-1]
                        ? 0
                        : 1
                    )

                );

        }

    }

    return 1 -
        dp[m][n] /
        Math.max(m,n);
}


/* =====================================================
   SMART NAME MATCH
===================================================== */

function nameMatches(q,n){

    q = normalizeSearch(q);
    n = normalizeSearch(n);

    if(!q || !n)
        return false;

    if(q === n)
        return true;

    if(n.includes(q))
        return true;

    if(q.includes(n))
        return true;

    const qw = q.split(" ");
    const nw = n.split(" ");

    for(
        const x of qw
    ){

        if(x.length < 2)
            continue;

        for(
            const y of nw
        ){

            if(y === x)
                return true;

            if(
                similarity(x,y) >= 0.72
            )
                return true;

        }

    }

    if(
        similarity(q,n) >= 0.72
    )
        return true;

    return false;
}


/* =====================================================
   PERSON BLOCK
===================================================== */

function extractPersonBlocks(text){

    text =
        fixPdfBangla(text)

        .replace(
            /([০-৯0-9]{1,6})\s*\.\s*/g,
            "\n$1. "
        );

    return text

        .split(
            /\n(?=[০-৯0-9]{1,6}\.)/
        )

        .map(cleanText)

        .filter(
            x =>
            /^[০-৯0-9]{1,6}\./.test(x)
        );
}


/* =====================================================
   PARSE VOTER
===================================================== */

function parseVoterData(block){

    block =
        fixPdfBangla(
            cleanText(block)
        );

    const sm =
        block.match(
            /^([০-৯0-9]{1,6})\./
        );

    let name =
        (
            block.match(
                /নাম\s*[:：]?\s*(.*?)\s*(?=ভোটার|পিতা|স্বামী|মাতা|পেশা|জন্ম|ঠিকানা|$)/i
            ) || []
        )[1] || "";

    if(!name){

        let x =
            block.replace(
                /^[০-৯0-9]{1,6}\.\s*/,
                ""
            );

        let p =
            x.search(
                /ভোটার|পিতা|স্বামী|মাতা|পেশা|জন্ম|ঠিকানা/
            );

        name =
            p > 0
            ? x.slice(0,p)
            : x
                .split(" ")
                .slice(0,4)
                .join(" ");

    }

    const get =
        re =>
        (
            block.match(re) || []
        )[1] || "";

    return {

        serial:
            sm ? sm[1] : "",

        name:
            cleanText(name),

        voterNo:
            get(
                /ভোটার\s*নং\s*[:：-]?\s*([০-৯0-9]+)/i
            ),

        dob:
            get(
                /জন্ম\s*তারিখ\s*[:：]?\s*([০-৯0-9]{1,2}[\/\-\.][০-৯0-9]{1,2}[\/\-\.][০-৯0-9]{2,4})/i
            ),

        parent:
            get(
                /(?:পিতা|স্বামী)\s*[:：]?\s*(.*?)\s*(?=মাতা|পেশা|জন্ম|ঠিকানা|$)/i
            ),

        mother:
            get(
                /মাতা\s*[:：]?\s*(.*?)\s*(?=পেশা|জন্ম|ঠিকানা|$)/i
            ),

        occupation:
            get(
                /পেশা\s*[:：]?\s*(.*?)\s*(?=জন্ম|ঠিকানা|$)/i
            ),

        address:
            get(
                /ঠিকানা\s*[:：]?\s*(.*)$/i
            )

    };
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(v){

    return String(
        v ?? ""
    )

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   BUILD INDEX
===================================================== */

async function buildIndex(
    force = false
){

    if(!force){

        try{

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        INDEX_KEY
                    ) || "null"
                );

            if(
                saved &&
                saved.length
            ){

                voterIndex =
                    saved;

                indexReady =
                    true;

                updateStats();

                document.getElementById(
                    "status"
                ).textContent =
                    "✅ সংরক্ষিত Index প্রস্তুত।";

                return;

            }

        }catch(e){}

    }


    const status =
        document.getElementById(
            "status"
        );

    const bar =
        document.getElementById(
            "progressBar"
        );

    const btn =
        document.getElementById(
            "searchBtn"
        );

    btn.disabled = true;

    voterIndex = [];


    document.getElementById(
        "indexStatus"
    ).textContent =
        "তৈরি হচ্ছে";


    for(
        let i=0;
        i<pdfList.length;
        i++
    ){

        const [
            file,
            url
        ] =
        pdfList[i];


        status.textContent =
            `📖 Index তৈরি হচ্ছে:
            ${file}
            — ${i+1}/${pdfList.length}`;


        bar.style.width =
            (
                (i+1) /
                pdfList.length *
                100
            ) + "%";


        try{

            const pdf =
                await pdfjsLib
                .getDocument(url)
                .promise;


            for(
                let pageNo=1;
                pageNo<=pdf.numPages;
                pageNo++
            ){

                try{

                    const page =
                        await pdf.getPage(
                            pageNo
                        );

                    const tc =
                        await page
                        .getTextContent();


                    const text =
                        tc.items
                        .map(
                            x => x.str
                        )
                        .join(" ");


                    const blocks =
                        extractPersonBlocks(
                            text
                        );


                    for(
                        const block
                        of blocks
                    ){

                        const v =
                            parseVoterData(
                                block
                            );


                        if(v.name){

                            v.pdfUrl =
                                url +
                                "#page=" +
                                pageNo;

                            v.page =
                                pageNo;

                            v.file =
                                file;

                            voterIndex.push(v);

                        }

                    }

                }catch(e){

                    console.warn(
                        "Page error",
                        file,
                        pageNo,
                        e
                    );

                }

            }

        }catch(e){

            console.warn(
                "PDF error",
                file,
                e
            );

        }

    }


    try{

        localStorage.setItem(
            INDEX_KEY,
            JSON.stringify(
                voterIndex
            )
        );

    }catch(e){}


    indexReady = true;

    btn.disabled = false;

    updateStats();


    status.textContent =
        `✅ Index তৈরি শেষ —
        ${convertDigits(
            voterIndex.length
        )}
        টি রেকর্ড প্রস্তুত।`;


    document.getElementById(
        "indexStatus"
    ).textContent =
        "প্রস্তুত";

}

/* =====================================================
   SEARCH
===================================================== */

function performSearch(){

    if(!indexReady){

        alert(
            "প্রথমে Index তৈরি হতে দিন।"
        );

        return;
    }


    const nq =
        normalizeSearch(
            document.getElementById(
                "nameInput"
            ).value
        );


    const dq =
        digitsOnlyDate(
            document.getElementById(
                "dobInput"
            ).value
        );


    if(!nq && !dq){

        alert(
            "নাম অথবা জন্ম তারিখ লিখুন।"
        );

        return;
    }


    let results =
        voterIndex.filter(
            v => {

                const okName =
                    !nq ||
                    nameMatches(
                        nq,
                        v.name
                    );


                const voterDate =
                    digitsOnlyDate(
                        v.dob
                    );


                const okDob =
                    !dq ||
                    voterDate === dq ||
                    voterDate.includes(dq) ||
                    dq.includes(voterDate);


                return (
                    okName &&
                    okDob
                );

            }
        );


    /* DUPLICATE REMOVE */

    const seen =
        new Set();


    results =
        results.filter(
            v => {

                const key =
                    v.voterNo ||
                    (
                        v.name +
                        "|" +
                        v.dob +
                        "|" +
                        v.serial
                    );


                if(
                    seen.has(key)
                )
                    return false;


                seen.add(key);

                return true;

            }
        );


    document.getElementById(
        "resultCount"
    ).textContent =
        convertDigits(
            results.length
        );


    document.getElementById(
        "resultSummary"
    ).textContent =
        `${convertDigits(
            results.length
        )} টি ফলাফল`;


    document.getElementById(
        "status"
    ).textContent =
        results.length
        ? `✅ ${convertDigits(
            results.length
          )} টি ফলাফল পাওয়া গেছে।`
        : "❌ কোনো ফলাফল পাওয়া যায়নি।";


    if(results.length){

        document.getElementById(
            "results"
        ).innerHTML =
            results
            .map(
                renderResult
            )
            .join("");

    }else{

        document.getElementById(
            "results"
        ).innerHTML = `

        <div class="empty">

            <h3>
                😔 কোনো ফলাফল পাওয়া যায়নি
            </h3>

            <p>
                নামের বানান বা জন্ম তারিখ
                পরীক্ষা করে আবার চেষ্টা করুন।
            </p>

        </div>

        `;

    }

}

/* =====================================================
   PRINT A5
===================================================== */

function printSingleResult(
    id
){

    const card =
        document.getElementById(
            id
        );


    if(!card){

        alert(
            "প্রিন্ট করার তথ্য পাওয়া যায়নি।"
        );

        return;
    }


    document
    .querySelectorAll(
        ".print-area"
    )
    .forEach(
        x =>
        x.classList.remove(
            "print-area"
        )
    );


    card.classList.add(
        "print-area"
    );


    window.print();


    setTimeout(
        () => {

            card.classList.remove(
                "print-area"
            );

        },
        1000
    );

}
