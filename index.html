/* =====================================================

===================================================== */

function normalizeText(text){

    if(!text){

        return "";

    }


    return String(text)

        .toLowerCase()

        .trim()

        .replace(/\s+/g," ");

}


/* =====================================================
   BANGLA NUMBER TO ENGLISH
===================================================== */

function banglaToEnglishNumber(text){

    if(!text){

        return "";

    }


    const bangla =
        "০১২৩৪৫৬৭৮৯";


    const english =
        "0123456789";


    let result = "";


    for(
        const char of String(text)
    ){

        const index =
            bangla.indexOf(char);


        if(index !== -1){

            result +=
                english[index];

        }

        else{

            result +=
                char;

        }

    }


    return result;

}

/* =====================================================

function getPdfUrl(filename){

    return filename;

/* =====================================================
   EXTRACT PDF TEXT
===================================================== */

async function extractPdfText(
    filename
){

    const loadingTask =
        pdfjsLib.getDocument(
            getPdfUrl(filename)
        );


    const pdf =
        await loadingTask.promise;


    let fullText = "";


    for(
        let pageNumber = 1;

        pageNumber <=
        pdf.numPages;

        pageNumber++
    ){

        const page =
            await pdf.getPage(
                pageNumber
            );


        const content =
            await page.getTextContent();


        const pageText =
            content.items

                .map(
                    item =>
                        item.str
                )

                .join(" ");


        fullText +=
            pageText +
            "\n";

    }


    return fullText;

}

    voterIndex = [];


    for(
        let i = 0;

        i < PDF_FILES.length;

        i++
    ){

        const filename =
            PDF_FILES[i];


        statusBox.textContent =
            `তথ্য প্রস্তুত হচ্ছে... ${i + 1}/${PDF_FILES.length}`;


        try{

            const text =
                await extractPdfText(
                    filename
                );


            voterIndex.push({

                filename:
                    filename,

                text:
                    normalizeText(
                        banglaToEnglishNumber(
                            text
                        )
                    )

            });

        }

        catch(error){

            console.error(
                "PDF Error:",
                filename,
                error
            );

        }

    }


    saveIndex();


    statusBox.className =
        "success";


    statusBox.textContent =
        `তথ্য প্রস্তুত সম্পন্ন। ${voterIndex.length}টি PDF প্রস্তুত হয়েছে।`;

}


/* =====================================================
   SEARCH
===================================================== */

function searchVoter(){

    const name =
        normalizeText(
            nameInput.value
        );


    const dob =
        normalizeText(
            banglaToEnglishNumber(
                dobInput.value
            )
        );


    if(
        !name &&
        !dob
    ){

        statusBox.style.display =
            "block";


        statusBox.className =
            "error";


        statusBox.textContent =
            "নাম অথবা জন্মতারিখ লিখুন।";


        return;

    }


    if(
        voterIndex.length ===
        0
    ){

        statusBox.style.display =
            "block";


        statusBox.className =
            "error";


        statusBox.textContent =
            "PDF Index এখনো তৈরি হয়নি। কিছুক্ষণ অপেক্ষা করে আবার চেষ্টা করুন।";


        return;

    }


    const found =
        voterIndex.filter(
            function(item){

                const text =
                    item.text;


                if(
                    name &&
                    dob
                ){

                    return (
                        text.includes(name) &&
                        text.includes(dob)
                    );

                }


                if(name){

                    return text.includes(
                        name
                    );

                }


                if(dob){

                    return text.includes(
                        dob
                    );

                }


                return false;

            }
        );


    displayResults(found);

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(found){

    resultCount.textContent =
        found.length;


    results.innerHTML =
        "";


    statusBox.style.display =
        "block";


    if(
        found.length ===
        0
    ){

        statusBox.className =
            "error";


        statusBox.textContent =
            "কোনো PDF-এ মিল পাওয়া যায়নি.";


        results.innerHTML = `

            <div class="loading">

                😔 কোনো ফলাফল পাওয়া যায়নি।

            </div>

        `;


        return;

    }


    statusBox.className =
        "success";


    statusBox.textContent =
        `${found.length}টি PDF-এ তথ্য পাওয়া গেছে।`;


    found.forEach(
        function(item){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "resultItem";


            div.innerHTML = `

                <div class="resultInfo">

                    <div class="resultName">
                        📄 ${escapeHtml(item.filename)}
                    </div>

                    <div class="resultDetails">
                        অনুসন্ধানের সাথে মিল পাওয়া গেছে।
                    </div>

                </div>


                <button
                    class="viewPdfBtn"
                >
                    👁️ PDF দেখুন
                </button>

            `;


            const button =
                div.querySelector(
                    ".viewPdfBtn"
                );


            button.addEventListener(
                "click",
                function(){

                    openPdf(
                        item.filename
                    );

                }
            );


            results.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* =====================================================
   OPEN PDF
===================================================== */

async function openPdf(filename){

    currentPdfFilename =
        filename;


    pdfWindow.style.display =
        "flex";


    pdfTitle.textContent =
        filename;


    pdfBody.innerHTML = `

        <div class="loading">
            PDF লোড হচ্ছে...
        </div>

    `;


    try{

        const pdf =
            await pdfjsLib
                .getDocument(
                    getPdfUrl(filename)
                )
                .promise;


        pdfBody.innerHTML =
            "";


        for(
            let pageNumber = 1;

            pageNumber <=
            pdf.numPages;

            pageNumber++
        ){

            const page =
                await pdf.getPage(
                    pageNumber
                );


            /*
               1.5 scale
               ভালো মানের PDF preview
            */

            const viewport =
                page.getViewport({
                    scale:1.5
                });


            const pageDiv =
                document.createElement(
                    "div"
                );


            pageDiv.className =
                "pdfPage";


            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                viewport.width;


            canvas.height =
                viewport.height;


            pageDiv.appendChild(
                canvas
            );


            /*
               Watermark
            */

            const watermark =
                document.createElement(
                    "div"
                );


            watermark.className =
                "watermark";


            watermark.innerHTML = `
                আলী ইসলাম<br>
                উদ্যোক্তা<br>
                ০৩ নং পাঁচলাইশ ওয়ার্ড
            `;


            pageDiv.appendChild(
                watermark
            );


            pdfBody.appendChild(
                pageDiv
            );


            const context =
                canvas.getContext(
                    "2d"
                );


            await page.render({

                canvasContext:
                    context,

                viewport:
                    viewport

            }).promise;

        }

    }

    catch(error){

        console.error(error);


        pdfBody.innerHTML = `

            <div class="loading">

                ❌ PDF লোড করা যাচ্ছে না।

                <br><br>

                ফাইলের নাম অথবা PDF path পরীক্ষা করুন।

            </div>

        `;

    }

}


/* =====================================================
   PRINT PDF
===================================================== */

function printCurrentPdf(){

    const pages =
        document.querySelectorAll(
            "#pdfBody .pdfPage"
        );


    if(
        pages.length === 0
    ){

        alert(
            "প্রথমে PDF সম্পূর্ণ লোড হতে দিন।"
        );

        return;

    }


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if(!printWindow){

        alert(
            "Print window খুলতে পারেনি। Browser popup অনুমতি দিন।"
        );

        return;

    }


    printWindow.document.open();


    printWindow.document.write(`

<!DOCTYPE html>

<html lang="bn">

<head>

<meta charset="UTF-8">

<title>
    ${escapeHtml(currentPdfFilename)}
</title>

<style>

@page{

    size:A4;

    margin:0;

}


html,
body{

    margin:0;

    padding:0;

    background:white;

}


.printPage{

    width:210mm;

    min-height:297mm;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    page-break-after:always;

    overflow:hidden;

    position:relative;

}


.printPage img{

    display:block;

    width:100%;

    height:auto;

}


@media print{

    .printPage{

        page-break-after:always;

    }

}

</style>

</head>

<body>

`);


    pages.forEach(
        function(page){

            const canvas =
                page.querySelector(
                    "canvas"
                );


            if(!canvas){

                return;

            }


            const image =
                canvas.toDataURL(
                    "image/png"
                );


            printWindow.document.write(`

                <div class="printPage">

                    <img
                        src="${image}"
                    >

                </div>

            `);

        }
    );


    printWindow.document.write(`

</body>

</html>

`);


    printWindow.document.close();


    /*
       Browser-কে images load করার
       সময় দেওয়া হচ্ছে।
    */

    setTimeout(
        function(){

            printWindow.focus();

            printWindow.print();

        },
        1000
    );

}
