// =====================================================
// DIGIT CONVERSION
// =====================================================

function convertDigits(str,toBangla=true){

    const bn="০১২৩৪৫৬৭৮৯";
    const en="0123456789";

    return String(str || "").replace(/[০-৯0-9]/g,function(ch){

        if(toBangla){

            const i=en.indexOf(ch);

            return i>=0 ? bn[i] : ch;

        }else{

            const i=bn.indexOf(ch);

            return i>=0 ? en[i] : ch;

        }

    });

}


// =====================================================
// PDF TEXT CLEAN
// =====================================================

function cleanText(text){

    return String(text || "")
        .replace(/\u00A0/g," ")
        .replace(/\s+/g," ")
        .trim();

}


// =====================================================
// PDF BANGLA FIX
// =====================================================

function fixPdfBangla(text){

    let s=cleanText(text);


    const replacements={

        "োভাটার":"ভোটার",
        "োভাটার নং":"ভোটার নং",

        "সামী":"স্বামী",

        "িপতা":"পিতা",

        "িঠকানা":"ঠিকানা",

        "োপশা":"পেশা",

        "জন তািরখ":"জন্ম তারিখ",

        "জন্ম তািরখ":"জন্ম তারিখ",

        "গৃিহনী":"গৃহিণী",

        "বায়িজদ":"বায়েজিদ",

        "ওয়ােজদিয়া":"ওয়াজেদিয়া",

        "ওয়ােজিদয়া":"ওয়াজেদিয়া"

    };


    for(const wrong in replacements){

        s=s.split(wrong).join(
            replacements[wrong]
        );

    }


    return s;

}


// =====================================================
// NORMALIZE
// =====================================================

function normalizeSearch(text){

    return fixPdfBangla(text)
        .toLowerCase()
        .normalize("NFC")
        .replace(/[\u200B\u200C\u200D\uFEFF]/g,"")
        .replace(/[.,:;|()[\]{}\-]/g," ")
        .replace(/\s+/g," ")
        .trim();

}


// =====================================================
// LEVENSHTEIN SIMILARITY
// =====================================================

function similarity(a,b){

    a=normalizeSearch(a);
    b=normalizeSearch(b);

    if(!a || !b)
        return 0;

    if(a===b)
        return 1;

    if(a.includes(b) || b.includes(a))
        return .95;


    const matrix=[];


    for(let i=0;i<=a.length;i++){

        matrix[i]=[i];

    }


    for(let j=0;j<=b.length;j++){

        matrix[0][j]=j;

    }


    for(let i=1;i<=a.length;i++){

        for(let j=1;j<=b.length;j++){

            const cost=
                a[i-1]===b[j-1] ? 0 : 1;


            matrix[i][j]=Math.min(

                matrix[i-1][j]+1,

                matrix[i][j-1]+1,

                matrix[i-1][j-1]+cost

            );

        }

    }


    return 1 -
        matrix[a.length][b.length] /
        Math.max(a.length,b.length);

}


// =====================================================
// NAME MATCH
// =====================================================

function nameMatches(query,name){

    if(!query || !name)
        return false;


    const q=normalizeSearch(query);
    const n=normalizeSearch(name);


    // সরাসরি
    if(q===n)
        return true;


    // একটির ভিতরে অন্যটি
    if(n.includes(q))
        return true;

    if(q.includes(n))
        return true;


    // শব্দ অনুযায়ী
    const qWords=
        q.split(/\s+/).filter(Boolean);

    const nWords=
        n.split(/\s+/).filter(Boolean);


    let matched=0;


    for(const qw of qWords){

        let found=false;


        for(const nw of nWords){

            if(
                nw.includes(qw) ||
                qw.includes(nw)
            ){

                found=true;
                break;

            }


            // বাংলা OCR ভুলের জন্য
            if(
                similarity(qw,nw)>=0.45
            ){

                found=true;
                break;

            }

        }


        if(found)
            matched++;

    }


    // নামের সবগুলো শব্দ পাওয়া গেলে
    if(
        qWords.length>1 &&
        matched===qWords.length
    ){

        return true;

    }


    // এক শব্দের নাম হলে
    if(
        qWords.length===1 &&
        matched>=1
    ){

        return true;

    }


    // পুরো নামের similarity
    if(
        similarity(q,n)>=0.45
    ){

        return true;

    }


    return false;

}


// =====================================================
// PERSON BLOCK
// =====================================================

function extractPersonBlocks(pageText){

    let text=fixPdfBangla(pageText);


    /*
       PDF-এর প্রতিটি ভোটার সাধারণত
       ০০০১. নাম:
       ০০০২. নাম:
       ইত্যাদি।
    */


    text=text.replace(
        /([০-৯0-9]{1,6})\s*\.\s*/g,
        "\n$1. "
    );


    const lines=
        text.split("\n")
        .map(x=>x.trim())
        .filter(Boolean);


    const blocks=[];

    let current="";


    for(const line of lines){

        if(
            /^[০-৯0-9]{1,6}\s*\./.test(line)
        ){

            if(current){

                blocks.push(current);

            }


            current=line;

        }else{

            if(current){

                current += " " + line;

            }

        }

    }


    if(current){

        blocks.push(current);

    }


    return blocks.filter(block=>{

        return /নাম/i.test(
            fixPdfBangla(block)
        );

    });

}


// =====================================================
// PARSE VOTER DATA
// =====================================================

function parseVoterData(block){

    const text=fixPdfBangla(block);


    const serialMatch=
        text.match(
            /^([০-৯0-9]{1,6})\s*\./
        );


    const nameMatch=
        text.match(
            /নাম\s*[:：]?\s*(.*?)\s*(?=ভোটার|পিতা|স্বামী|মাতা|পেশা|জন্ম|ঠিকানা|$)/i
        );


    const voterMatch=
        text.match(
            /ভোটার\s*নং\s*[:：-]?\s*([০-৯0-9]+)/i
        );


    const fatherMatch=
        text.match(
            /(?:পিতা|স্বামী)\s*[:：]?\s*(.*?)\s*(?=মাতা|পেশা|জন্ম|ঠিকানা|$)/i
        );


    const motherMatch=
        text.match(
            /মাতা\s*[:：]?\s*(.*?)\s*(?=পেশা|জন্ম|ঠিকানা|$)/i
        );


    const occupationMatch=
        text.match(
            /পেশা\s*[:：]?\s*(.*?)\s*(?=জন্ম|ঠিকানা|$)/i
        );


    const dobMatch=
        text.match(
            /জন্ম\s*তারিখ\s*[:：]?\s*([০-৯0-9]{1,2}[\/.-][০-৯0-9]{1,2}[\/.-][০-৯0-9]{4})/i
        );


    const addressMatch=
        text.match(
            /ঠিকানা\s*[:：]?\s*(.+)$/i
        );


    return{

        name:nameMatch
            ?nameMatch[1].trim()
            :"N/A",

        serial:serialMatch
            ?convertDigits(
                serialMatch[1],
                true
            )
            :"N/A",

        voterNo:voterMatch
            ?convertDigits(
                voterMatch[1],
                true
            )
            :"N/A",

        father:fatherMatch
            ?fatherMatch[1].trim()
            :"N/A",

        mother:motherMatch
            ?motherMatch[1].trim()
            :"N/A",

        occupation:occupationMatch
            ?occupationMatch[1].trim()
            :"N/A",

        dob:dobMatch
            ?convertDigits(
                dobMatch[1],
                true
            )
            :"N/A",

        address:addressMatch
            ?addressMatch[1].trim()
            :"N/A"

    };

}


// =====================================================
// HTML ESCAPE
// =====================================================

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


// =====================================================
// MAIN SEARCH
// =====================================================

async function performSearch(){

    const nameQuery=
        document.getElementById(
            "nameInput"
        ).value.trim();


    const dobQuery=
        document.getElementById(
            "dobInput"
        ).value.trim();


    const resultsDiv=
        document.getElementById(
            "results"
        );


    const statusDiv=
        document.getElementById(
            "status"
        );


    const searchBtn=
        document.getElementById(
            "searchBtn"
        );


    resultsDiv.innerHTML="";


    if(!nameQuery && !dobQuery){

        statusDiv.innerText=
            "অনুগ্রহ করে নাম অথবা জন্ম তারিখ লিখুন।";

        return;

    }


    searchBtn.disabled=true;


    let matchCount=0;


    const used=new Set();


    const searchDob=
        normalizeSearch(
            convertDigits(
                dobQuery,
                true
            )
        );


    // =================================================
    // PDF LOOP
    // =================================================

    for(
        let fileIndex=0;
        fileIndex<pdfList.length;
        fileIndex++
    ){

        const pdfInfo=
            pdfList[fileIndex];


        statusDiv.innerHTML=`

            <div class="loading">

                <div class="spinner"></div>

                ফাইল
                ${convertDigits(fileIndex+1,true)}
                /
                ${convertDigits(pdfList.length,true)}
                পরীক্ষা করা হচ্ছে...

            </div>

        `;


        try{

            const loadingTask=
                pdfjsLib.getDocument({
                    url:pdfInfo.url
                });


            const pdf=
                await loadingTask.promise;


            // =========================================
            // PAGE LOOP
            // =========================================

            for(
                let pageNum=1;
                pageNum<=pdf.numPages;
                pageNum++
            ){

                const page=
                    await pdf.getPage(pageNum);


                const textContent=
                    await page.getTextContent();


                const pageText=
                    textContent.items
                    .map(item=>item.str)
                    .join(" ");


                if(!pageText.trim())
                    continue;


                const blocks=
                    extractPersonBlocks(
                        pageText
                    );


                // =====================================
                // PERSON LOOP
                // =====================================

                for(const block of blocks){

                    const data=
                        parseVoterData(block);


                    if(data.name==="N/A")
                        continue;


                    // -------------------------------
                    // NAME
                    // -------------------------------

                    let nameOK=true;


                    if(nameQuery){

                        nameOK=
                            nameMatches(
                                nameQuery,
                                data.name
                            );

                    }


                    // -------------------------------
                    // DOB
                    // -------------------------------

                    let dobOK=true;


                    if(dobQuery){

                        const actualDob=
                            normalizeSearch(
                                data.dob
                            );


                        dobOK=
                            actualDob===searchDob ||
                            actualDob.includes(searchDob);

                    }


                    if(!nameOK || !dobOK)
                        continue;


                    // -------------------------------
                    // DUPLICATE
                    // -------------------------------

                    const uniqueKey=
                        data.voterNo!=="N/A"
                        ?data.voterNo
                        :data.name+"|"+data.dob;


                    if(used.has(uniqueKey))
                        continue;


                    used.add(uniqueKey);

                    matchCount++;


                    // =================================
                    // CARD
                    // =================================

                    const card=
                        document.createElement(
                            "div"
                        );


                    card.className=
                        "info-card";


                    card.innerHTML=`

                        <div class="result-badge">

                            ফলাফল নং:
                            ${convertDigits(
                                matchCount,
                                true
                            )}

                        </div>


                        <div class="watermark">

                            আলী ইসলাম<br>

                            উদ্যোক্তা,
                            ০৩ নং পাঁচলাইশ ওয়ার্ড

                        </div>


                        <div class="card-details">

                            <div class="field-row">

                                <strong>নাম:</strong>

                                ${escapeHTML(
                                    data.name
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    সিরিয়াল নাম্বার:
                                </strong>

                                ${escapeHTML(
                                    data.serial
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    ভোটার নং:
                                </strong>

                                ${escapeHTML(
                                    data.voterNo
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    জন্ম তারিখ:
                                </strong>

                                ${escapeHTML(
                                    data.dob
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    পিতা/স্বামী:
                                </strong>

                                ${escapeHTML(
                                    data.father
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    মাতা:
                                </strong>

                                ${escapeHTML(
                                    data.mother
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    পেশা:
                                </strong>

                                ${escapeHTML(
                                    data.occupation
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    এলাকা:
                                </strong>

                                ${escapeHTML(
                                    data.address
                                )}

                            </div>


                            <div class="field-row">

                                <strong>
                                    ওয়ার্ড:
                                </strong>

                                ওয়ার্ড নং-০৩

                            </div>

                        </div>


                        <div style="
                            text-align:center;
                            position:relative;
                            z-index:3;
                        ">

                            <a
                                href="${pdfInfo.url}#page=${pageNum}"
                                target="_blank"
                                class="pdf-link-btn"
                            >

                                📄 মূল PDF দেখুন

                                (পৃষ্ঠা
                                ${convertDigits(
                                    pageNum,
                                    true
                                )})

                            </a>

                        </div>

                    `;


                    resultsDiv.appendChild(card);

                }

            }


        }catch(error){

            console.error(
                "PDF পড়তে সমস্যা:",
                pdfInfo.url,
                error
            );

        }

    }


    // =================================================
    // RESULT
    // =================================================

    if(matchCount>0){

        statusDiv.innerText=
            `সর্বমোট ${convertDigits(
                matchCount,
                true
            )}টি তথ্য পাওয়া গেছে।`;

    }else{

        statusDiv.innerText=
            "কোনো তথ্য পাওয়া যায়নি।";


        resultsDiv.innerHTML=`

            <div class="no-result">

                ❌ কোনো তথ্য পাওয়া যায়নি।

                <br><br>

                নাম বা জন্ম তারিখ সঠিকভাবে লিখে
                আবার চেষ্টা করুন।

            </div>

        `;

    }


    searchBtn.disabled=false;

}

// ENTER KEY

document
.getElementById("nameInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            performSearch();
        }

    }
);


document
.getElementById("dobInput")
.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            performSearch();
        }

    }
);

</script>
