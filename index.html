/* =========================================================
   DIGIT CONVERSION
========================================================= */

function convertDigits(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/[০-৯]/g, function(d){

            return "০১২৩৪৫৬৭৮৯".indexOf(d);

        });

}


/* =========================================================
   TEXT CLEAN
========================================================= */

function cleanText(text){

    return String(text || "")
        .replace(/\u00a0/g," ")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   PDF BANGLA FIX
========================================================= */

function fixPdfBangla(text){

    return cleanText(text);

}


/* =========================================================
   SEARCH NORMALIZATION
========================================================= */

function normalizeSearch(text){

    return convertDigits(text)
        .toLowerCase()
        .replace(/[ঃ:]/g,"")
        .replace(/[.,]/g,"")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   ⭐ জন্ম তারিখ NORMALIZATION
   বাংলা + ইংরেজি সংখ্যা
   / - . সব format support
========================================================= */

function normalizeDate(date){

    if(!date){
        return "";
    }

    let d = convertDigits(String(date).trim());

    /* separator এক করা */

    d = d.replace(/[.\-]/g,"/");

    /* separator-এর আশেপাশের space বাদ */

    d = d.replace(/\s*\/\s*/g,"/");

    /* অতিরিক্ত space বাদ */

    d = d.replace(/\s+/g,"");

    const match =
        d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

    if(!match){

        return d;

    }

    const day =
        match[1].padStart(2,"0");

    const month =
        match[2].padStart(2,"0");

    const year =
        match[3];

    return `${day}/${month}/${year}`;

}


/* =========================================================
   NAME SIMILARITY
========================================================= */

function similarity(a,b){

    a = normalizeSearch(a);

    b = normalizeSearch(b);

    if(!a || !b){
        return 0;
    }

    if(a === b){
        return 1;
    }

    if(a.includes(b) || b.includes(a)){
        return 0.9;
    }

    const aWords = a.split(" ");

    const bWords = b.split(" ");

    let matched = 0;

    aWords.forEach(function(word){

        if(
            word &&
            bWords.some(function(x){
                return x.includes(word) || word.includes(x);
            })
        ){

            matched++;

        }

    });

    return matched /
        Math.max(aWords.length,bWords.length);

}


/* =========================================================
   NAME MATCH
========================================================= */

function nameMatches(actual, searched){

    const a = normalizeSearch(actual);

    const b = normalizeSearch(searched);

    if(!a || !b){
        return false;
    }

    if(a === b){
        return true;
    }

    if(a.includes(b)){
        return true;
    }

    if(b.includes(a)){
        return true;
    }

    return similarity(a,b) >= 0.55;

}


/* =========================================================
   PERSON BLOCK EXTRACTION
========================================================= */

function extractPersonBlocks(text){

    const lines =
        String(text || "")
        .split(/\n/)
        .map(function(x){
            return cleanText(x);
        })
        .filter(Boolean);


    const blocks = [];

    let current = [];

    const serialRegex =
        /^\s*[০-৯0-9]{1,6}\s*[\.\-ঃ:)]/;


    lines.forEach(function(line){

        if(serialRegex.test(line)){

            if(current.length){

                blocks.push(current.join(" "));

            }

            current = [line];

        }else{

            current.push(line);

        }

    });


    if(current.length){

        blocks.push(current.join(" "));

    }


    /* যদি serial দিয়ে block না পাওয়া যায় */

    if(blocks.length === 0){

        return [cleanText(text)];

    }


    return blocks;

}

        );


    if(nameMatch){

        name = cleanText(nameMatch[1]);

    }else{

        const fallback =
            text.match(
                /নাম\s*[:：]?\s*(.{2,80})/i
            );

                    fallback[1]

    const dobMatch =
        text.match(
            /জন্ম\s*তারিখ\s*[:：]?\s*([০-৯0-9]{1,2}\s*[\/.\-]\s*[০-৯0-9]{1,2}\s*[\/.\-]\s*[০-৯0-9]{4})/i
        );


    if(dobMatch){

        dob =
            normalizeDate(
                dobMatch[1]
            );

    }


    return {

        name:name,

        dob:dob,

        raw:text

    };

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   GET PDF PAGE TEXT
========================================================= */

async function getPageText(pdf,pageNumber){

    const page =
        await pdf.getPage(pageNumber);

    const content =
        await page.getTextContent();


    return content.items
        .map(function(item){

            return item.str || "";

        })
        .join(" ");

}


/* =========================================================
   SEARCH
========================================================= */

async function performSearch(){

    const nameQuery =
        document.getElementById("nameInput").value.trim();

    const dobQuery =
        document.getElementById("dobInput").value.trim();


    const searchName =
        normalizeSearch(nameQuery);


    /* ⭐ এখানে নতুন DOB normalization */

    const searchDob =
        normalizeDate(dobQuery);


    if(!searchName && !searchDob){

        alert(
            "নাম অথবা জন্ম তারিখ লিখুন।"
        );

        return;

    }


    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");


    results.innerHTML = "";

    status.style.display = "block";

    status.innerHTML =
        "🔎 অনুসন্ধান শুরু হচ্ছে...";


    let found = [];

    let processed = 0;


    try{

        for(
            let i=0;
            i<pdfList.length;
            i++
        ){

            const file =
                pdfList[i];


            status.innerHTML =
                `🔎 PDF অনুসন্ধান চলছে...<br>
                 ${i+1} / ${pdfList.length}
                 <br>
                 ${escapeHTML(file)}`;


            const pdf =
                await pdfjsLib.getDocument(file).promise;


            for(
                let pageNo=1;
                pageNo<=pdf.numPages;
                pageNo++
            ){

                const text =
                    await getPageText(
                        pdf,
                        pageNo
                    );


                const fixedText =
                    fixPdfBangla(text);


                const blocks =
                    extractPersonBlocks(
                        fixedText
                    );


                for(
                    let b=0;
                    b<blocks.length;
                    b++
                ){

                    const data =
                        parseVoterData(
                            blocks[b]
                        );


                    if(
                        !data.name &&
                        !data.dob
                    ){

                        continue;

                    }


                    let nameOK = true;

                    let dobOK = true;


                    /* ================= NAME ================= */

                    if(searchName){

                        nameOK =
                            nameMatches(
                                data.name,
                                searchName
                            );

                    }


                    /* ================= DOB ================= */

                    if(searchDob){

                        const actualDob =
                            normalizeDate(
                                data.dob
                            );


                        /*
                           আগে ছিল strict mismatch।
                           এখন দুই পাশই normalize করা হচ্ছে।
                        */

                        dobOK =
                            actualDob === searchDob;

                    }


                    if(nameOK && dobOK){

                        found.push({

                            name:
                                data.name,

                            dob:
                                data.dob,

                            raw:
                                data.raw,

                            file:
                                file,

                            page:
                                pageNo

                        });

                    }

                }

            }


            processed++;

        }


        status.style.display = "none";


        /* ================= RESULTS ================= */

        if(found.length === 0){

            results.innerHTML = `
                <div class="no-result">

                    <div style="font-size:45px;">
                        🔍
                    </div>

                    <h3>
                        কোনো তথ্য পাওয়া যায়নি
                    </h3>

                    <p>
                        নাম অথবা জন্ম তারিখের বানান/ফরম্যাট
                        আবার পরীক্ষা করুন।
                    </p>

                    <p>
                        জন্ম তারিখ উদাহরণ:
                        <strong>15/08/1995</strong>
                    </p>

                </div>
            `;

            return;

        }


        results.innerHTML =
            `<h3 style="color:#0f766e;">
                মোট ${found.length}টি তথ্য পাওয়া গেছে
            </h3>`;


        found.forEach(function(item,index){

            const pdfUrl =
                item.file +
                "#page=" +
                item.page;


            const safeText =
                `নাম: ${item.name}
জন্ম তারিখ: ${item.dob}
PDF: ${item.file}
পৃষ্ঠা: ${item.page}`;


            results.innerHTML += `

                <div class="result-card">

                    <div class="result-title">
                        👤 ভোটার ${index+1}
                    </div>


                    <div class="info-grid">

                        <div class="info-item">

                            <div class="info-label">
                                নাম
                            </div>

                            <div class="info-value">
                                ${escapeHTML(item.name)}
                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                জন্ম তারিখ
                            </div>

                            <div class="info-value">
                                ${escapeHTML(item.dob || "পাওয়া যায়নি")}
                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                PDF ফাইল
                            </div>

                            <div class="info-value">
                                ${escapeHTML(item.file)}
                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                পৃষ্ঠা
                            </div>

                            <div class="info-value">
                                ${item.page}
                            </div>

                        </div>

                    </div>


                    <div class="result-actions">

                        <a
                            class="pdf-btn"
                            href="${escapeHTML(pdfUrl)}"
                            target="_blank"
                            rel="noopener"
                        >
                            📄 PDF দেখুন
                        </a>


                        <button
                            class="copy-btn"
                            onclick="copyVoter(${index})"
                        >
                            📋 তথ্য কপি
                        </button>

                    </div>

                </div>

            `;

        });


        /* Copy করার জন্য global variable */

        window.lastSearchResults =
            found;


    }catch(error){

        console.error(error);

        status.style.display = "none";

        results.innerHTML = `

            <div class="no-result">

                <div style="font-size:40px;">
                    ⚠️
                </div>

                <h3>
                    অনুসন্ধানের সময় সমস্যা হয়েছে
                </h3>

                <p>
                    PDF ফাইলের অবস্থান অথবা ফাইলের নাম
                    পরীক্ষা করুন।
                </p>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}


/* =========================================================

========================================================= */

window.copyVoter = function(index){

    if(
        !window.lastSearchResults ||
        !window.lastSearchResults[index]
    ){

        return;

    }


    const item =
        window.lastSearchResults[index];


    const text =
`ভোটার তথ্য

নাম: ${item.name}
জন্ম তারিখ: ${item.dob || "পাওয়া যায়নি"}
PDF: ${item.file}
পৃষ্ঠা: ${item.page}

আলী ইসলাম
উদ্যোক্তা
০৩ নং পাঁচলাইশ ওয়ার্ড`;


    navigator.clipboard
        .writeText(text)
        .then(function(){

            alert(
                "ভোটার তথ্য কপি হয়েছে।"
            );

        })
        .catch(function(){

            alert(
                "কপি করা সম্ভব হয়নি।"
            );

        });

};

/* =========================================================
   LOGIN
========================================================= */

async function login(){

    const userId =
        document
        .getElementById("userId")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    const errorBox =
        document.getElementById("loginError");


    errorBox.style.display = "none";


    if(!userId || !password){

        errorBox.innerText =
            "User ID এবং Password দিন।";

        errorBox.style.display = "block";

        return;

    }


    const email =
        userIdToEmail(userId);


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);


        let message =
            "Login করা যায়নি। User ID বা Password সঠিক কিনা দেখুন।";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message =
                "User ID অথবা Password ভুল।";

        }


        if(
            error.code ===
            "auth/user-not-found"
        ){

            message =
                "এই User ID পাওয়া যায়নি।";

        }


        if(
            error.code ===
            "auth/too-many-requests"
        ){

            message =
                "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

        }


        errorBox.innerText =
            message;

        errorBox.style.display =
            "block";

    }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   LOAD USER ROLE
========================================================= */

async function loadUserRole(user){

    try{

        const userRef =
            doc(
                db,
                "users",
                user.uid
            );


        const snap =
            await getDoc(userRef);


        if(!snap.exists()){

            await signOut(auth);

            alert(
                "আপনার User profile পাওয়া যায়নি।"
            );

            return;

        }


        const data =
            snap.data();


        const role =
            String(
                data.role || ""
            ).toLowerCase();


        if(
            role !== "admin" &&
            role !== "operator"
        ){

            await signOut(auth);

            alert(
                "আপনার অনুমতি নেই।"
            );

            return;

        }


        currentUser =
            user;


        currentRole =
            role;


        /* ================= USER INFO ================= */

        document
            .getElementById("loggedUser")
            .innerText =
                data.name ||
                data.userId ||
                user.email;


        document
            .getElementById("roleBadge")
            .innerText =
                role === "admin"
                ? "ADMIN"
                : "OPERATOR";


        /* ================= SHOW APP ================= */

        document
            .getElementById("loginScreen")
            .style.display =
                "none";


        document
            .getElementById("app")
            .style.display =
                "block";


        /* ================= ADMIN ================= */

        const adminElements =
            document.querySelectorAll(
                ".admin-only"
            );


        adminElements.forEach(
            function(el){

                el.style.display =
                    role === "admin"
                    ? "block"
                    : "none";

            }
        );


    }catch(error){

        console.error(error);

        await signOut(auth);

        alert(
            "User permission যাচাই করা যায়নি।"
        );

    }

}


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loadUserRole(user);

        }else{

            currentUser = null;

            currentRole = null;


            document
                .getElementById("loginScreen")
                .style.display =
                    "flex";


            document
                .getElementById("app")
                .style.display =
                    "none";

        }

    }
);
